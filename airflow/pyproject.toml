[project]
name = "homelab-airflow"
version = "0.0.1"
description = "Airflow DAGs and tooling for homelab"
requires-python = ">=3.14,<3.15"
dependencies = [
    "apache-airflow==3.4.0",
    "apache-airflow-providers-postgres==7.1.2",
    "apache-airflow-providers-cncf-kubernetes==11.0.0",
    "apache-airflow-providers-fab[oauth]==3.11.0",
    "authlib==1.9.5",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest]
addopts = ["-vv"]
testpaths = ["tests"]
