[project]
name = "homelab-airflow"
version = "0.0.1"
description = "Airflow DAGs and tooling for homelab"
requires-python = ">=3.15,<3.16"
dependencies = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-postgres==7.1.1",
    "apache-airflow-providers-cncf-kubernetes==10.24.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest]
addopts = ["-vv"]
testpaths = ["tests"]
