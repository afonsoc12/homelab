---
- name: Find stacks for host
  ansible.builtin.find:
    paths: "{{ docker_compose_stacks_src }}/{{ inventory_hostname }}"
    file_type: directory
  delegate_to: localhost
  register: docker_compose_stacks

- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_base_dir }}"
    state: directory
    mode: "0750"

- name: Ensure volume directories exist
  ansible.builtin.file:
    path: "{{ docker_compose_volumes_dir }}/{{ item.path | basename }}"
    state: directory
    mode: "0750"
  become: true
  loop: "{{ docker_compose_stacks.files }}"

- name: Sync stack directories to host
  ansible.posix.synchronize:
    src: "{{ item.path }}/"
    dest: "{{ docker_compose_base_dir }}/{{ item.path | basename }}"
    rsync_opts: >-
      {{
        ['--exclude=secrets.sops.yaml', '--exclude=.env']
        + (['--exclude=docker-compose.yaml'] if 'unraid' in group_names else [])
      }}
    delete: true
  loop: "{{ docker_compose_stacks.files }}"

- name: "Unraid | Check for template metadata (pre-deploy label pass)"
  ansible.builtin.stat:
    path: "{{ item.path }}/unraid.yml"
  delegate_to: localhost
  register: docker_compose_unraid_predeploy_meta_stat
  loop: "{{ docker_compose_stacks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: "'unraid' in group_names"

- name: "Unraid | Add the DockerMan-managed/webui/icon labels to every service"
  ansible.builtin.template:
    src: unraid-labels.yaml.j2
    dest: "{{ docker_compose_base_dir }}/{{ item.item.path | basename }}/docker-compose.yaml"
    mode: "0644"
  vars:
    stack_compose: "{{ lookup('ansible.builtin.file', item.item.path + '/docker-compose.yaml') | from_yaml }}"
    stack_meta: "{{ (lookup('ansible.builtin.file', item.item.path + '/unraid.yml') | from_yaml) if item.stat.exists else {} }}"
  loop: "{{ docker_compose_unraid_predeploy_meta_stat.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when: "'unraid' in group_names"

- name: Check for secrets files
  ansible.builtin.stat:
    path: "{{ item.path }}/secrets.sops.yaml"
  delegate_to: localhost
  register: docker_compose_secrets_stat
  loop: "{{ docker_compose_stacks.files }}"

- name: Decrypt secrets to dotenv
  ansible.builtin.command:
    cmd: "sops --decrypt --output-type dotenv {{ item.item.path }}/secrets.sops.yaml"
  delegate_to: localhost
  register: docker_compose_env_contents
  no_log: true
  changed_when: false
  loop: "{{ docker_compose_secrets_stat.results }}"
  when: item.stat.exists

- name: Write .env files on host
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ docker_compose_base_dir }}/{{ item.item.item.path | basename }}/.env"
    mode: "0600"
  no_log: true
  loop: "{{ docker_compose_env_contents.results }}"
  when: item.stdout is defined

- name: Create docker networks
  community.docker.docker_network:
    name: "{{ item.key }}"
    driver: "{{ item.value.driver }}"
    ipam_config: "{{ item.value.ipam_config | default(omit) }}"
    attachable: "{{ item.value.attachable | default(omit) }}"
  with_dict: "{{ docker_compose_networks if docker_compose_networks is iterable else {} }}"

- name: Deploy stacks (and prune after each)
  ansible.builtin.include_tasks: deploy_stack.yml
  vars:
    stack: "{{ item }}"
  loop: "{{ docker_compose_stacks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
    pause: 5

- name: Render DockerMan templates (Unraid hosts)
  ansible.builtin.include_tasks: unraid_templates.yml
  vars:
    stack: "{{ item }}"
  loop: "{{ docker_compose_stacks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: "'unraid' in group_names"

- name: "Unraid | Build autostart container list"
  ansible.builtin.set_fact:
    docker_compose_unraid_autostart_containers: >-
      {{
        (docker_compose_unraid_autostart_containers | default([]))
        + ((lookup('ansible.builtin.file', item.path + '/docker-compose.yaml') | from_yaml).services.values()
            | selectattr('restart', 'defined')
            | rejectattr('restart', 'equalto', 'no')
            | list)
      }}
  delegate_to: localhost
  loop: "{{ docker_compose_stacks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: "'unraid' in group_names"

# Unraid starts /var/lib/docker/unraid-autostart strictly in file order, waiting for
# each `docker start` to return before the next. A plain alphabetical sort ignores
# network_mode: service:<name>/container:<name> dependencies between stacks (e.g. an
# *arr container sharing a VPN container's netns) — a dependent can sort before the
# container it needs, and Docker fails to attach it (exit 128) since that container
# isn't running yet. Start anything with no such dependency first, then anything that
# has one, alphabetical within each group — sufficient for every stack in this repo
# today (a single one-level dependency: media-stack on privoxyvpn).
- name: "Unraid | Write autostart list (derived from each service's restart policy)"
  ansible.builtin.copy:
    content: |
      {%- set dependents = docker_compose_unraid_autostart_containers
          | selectattr('network_mode', 'defined')
          | selectattr('network_mode', 'match', '^(service|container):')
          | map(attribute='container_name') | list -%}
      {%- set independents = docker_compose_unraid_autostart_containers
          | map(attribute='container_name') | reject('in', dependents) | list -%}
      {% for name in (independents | sort + dependents | sort) %}
      {{ name }}
      {% endfor %}
    dest: /var/lib/docker/unraid-autostart
    mode: "0644"
  when: "'unraid' in group_names"

- name: "Unraid | Collect all container names"
  ansible.builtin.set_fact:
    docker_compose_unraid_all_containers: >-
      {{
        (docker_compose_unraid_all_containers | default([]))
        + ((lookup('ansible.builtin.file', item.path + '/docker-compose.yaml') | from_yaml).services.values()
            | map(attribute='container_name')
            | list)
      }}
  delegate_to: localhost
  loop: "{{ docker_compose_stacks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: "'unraid' in group_names"

- name: "Unraid | Slurp existing Docker tab order"
  ansible.builtin.slurp:
    src: /boot/config/plugins/dockerMan/userprefs.cfg
  register: docker_compose_unraid_userprefs_raw
  failed_when: false
  when: "'unraid' in group_names"

- name: "Unraid | Build Docker tab display order (preserve existing order, drop stale entries, append new ones, kopia last)"
  ansible.builtin.set_fact:
    docker_compose_unraid_existing_order: >-
      {{
        (docker_compose_unraid_userprefs_raw.content | b64decode | regex_findall('="([^"]+)"'))
        if (docker_compose_unraid_userprefs_raw.content is defined) else []
      }}
  when: "'unraid' in group_names"

- name: "Unraid | Compute final Docker tab display order"
  ansible.builtin.set_fact:
    docker_compose_unraid_order_containers: >-
      {{
        (docker_compose_unraid_existing_order | select('in', docker_compose_unraid_all_containers) | reject('equalto', 'kopia') | list)
        + (docker_compose_unraid_all_containers | reject('in', docker_compose_unraid_existing_order) | reject('equalto', 'kopia') | list)
        + (['kopia'] if 'kopia' in docker_compose_unraid_all_containers else [])
      }}
  when: "'unraid' in group_names"

- name: "Unraid | Write Docker tab display order"
  ansible.builtin.template:
    src: unraid-userprefs.cfg.j2
    dest: /boot/config/plugins/dockerMan/userprefs.cfg
    mode: "0644"
  when: "'unraid' in group_names"
