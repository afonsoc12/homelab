- name: Install hyperion
  become: true
  ansible.builtin.apt:
    name: hyperion

# restart service as the root user
- name: Disable systemd unit for user # noqa: name[template]
  become: true
  ansible.builtin.systemd:
    name: "hyperion@{{ ansible_user_id }}.service"
    state: stopped
    enabled: false

- name: Enable systemd unit @ root user
  become: true
  ansible.builtin.systemd:
    name: hyperion@root.service
    state: started
    enabled: true

- name: Verify hyperiond service
  become: true
  ansible.builtin.service:
    name: hyperion@root.service
    state: started

- name: Validate connection to hyperion servers
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 8090
    timeout: 30
    active_connection_states: ESTABLISHED

# Hyperion blocks/warns on requests from a "non-local" network (e.g. cross-VLAN,
# through ingress) while the API still uses the factory-default password. Since
# this instance is only reachable behind Authelia already, drop Hyperion's own
# auth requirement and allow non-local access so the app-level warning stops
# gating legitimate traffic from other VLANs.
- name: Disable hyperion API auth and allow non-local network access
  block:
    - name: Update hyperion network settings (unauthenticated)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8090/json-rpc"
        method: POST
        body_format: json
        body:
          command: settings
          subcommand: update
          settings:
            network:
              apiAuth: false
              localApiAuth: false
              internetAccessAPI: true
        status_code: 200
      register: hyperion_network_settings
  rescue:
    - name: Login with default hyperion credentials
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8090/json-rpc"
        method: POST
        body_format: json
        body:
          command: authorize
          subcommand: login
          password: "{{ hyperion_default_password }}"
        status_code: 200
      register: hyperion_login

    - name: Update hyperion network settings (authenticated)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8090/json-rpc"
        method: POST
        headers:
          Authorization: "Bearer {{ hyperion_login.json.info.token }}"
        body_format: json
        body:
          command: settings
          subcommand: update
          settings:
            network:
              apiAuth: false
              localApiAuth: false
              internetAccessAPI: true
        status_code: 200
