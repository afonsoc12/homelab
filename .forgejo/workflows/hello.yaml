name: hello
on: [push]

jobs:
  say-hello:
    runs-on: docker
    steps:
      - run: echo "hello from forgejo actions"
      - name: what am I actually running in?
        run: |
          cat /etc/os-release
          echo "--- versions ---"
          for bin in node npm git curl bash python3 python sh wget openssl; do
            if command -v "$bin" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$bin" "$("$bin" --version 2>&1 | head -1)"
            else
              printf "%-10s NOT PRESENT\n" "$bin"
            fi
          done
