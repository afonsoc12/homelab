{{- if and .Values.ingress.enabled (not .Values.ingress.tlsPassthrough) -}}
{{- if ne .Values.ingress.className "contour" -}}
{{- fail "Ingress requires the contour class; configure native SSO or a proxy backend for authentication" -}}
{{- end -}}
{{- $fullName := include "external-svc.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-svc.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | default "" | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    {{- $tlsHosts := default (list) .hosts }}
    {{- if and (empty $tlsHosts) (eq $.Values.ingress.className "contour") }}
    {{- range $.Values.ingress.hosts }}
    {{- $tlsHosts = append $tlsHosts .host }}
    {{- end }}
    {{- end }}
    - hosts:
        {{- range $tlsHosts }}
        - {{ tpl (. | quote) $ }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl (.host | quote) $ }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if .service }}
                name: {{ .service.name }}
                port:
                  number: {{ .service.port }}
                {{- else }}
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.server.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
