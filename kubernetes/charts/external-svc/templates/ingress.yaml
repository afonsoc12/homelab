{{- if and .Values.ingress.enabled (not .Values.ingress.contourPolicy) -}}
{{- if and .Values.ingress.authelia (ne .Values.ingress.className "nginx") -}}
{{- fail "nginx forward-auth annotations cannot protect another ingress class; configure a proxy backend" -}}
{{- end -}}
{{- $fullName := include "external-svc.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-svc.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | default "" | nindent 4 }}
    {{- end }}
    {{ if .Values.ingress.authelia -}}
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-url: http://{{ .Values.authelia.service }}/api/verify
    nginx.ingress.kubernetes.io/auth-signin: https://{{ .Values.authelia.url }}?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: Remote-User,Remote-Name,Remote-Groups,Remote-Email
    nginx.ingress.kubernetes.io/auth-snippet: proxy_set_header X-Forwarded-Method $request_method;
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    {{- $tlsHosts := default (list) .hosts }}
    {{- if and (empty $tlsHosts) (eq $.Values.ingress.className "contour") }}
    {{- range $.Values.ingress.hosts }}
    {{- $tlsHosts = append $tlsHosts .host }}
    {{- end }}
    {{- end }}
    - hosts:
        {{- range $tlsHosts }}
        - {{ tpl (. | quote) $ }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl (.host | quote) $ }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if .service }}
                name: {{ .service.name }}
                port:
                  number: {{ .service.port }}
                {{- else }}
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.server.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
