{{- if and .Values.ingress.enabled .Values.ingress.contourPolicy }}
{{- if or (ne .Values.ingress.className "contour") (or .Values.ingress.authelia .Values.ingress.authentik) }}
{{- fail "contourPolicy requires the contour class with nginx forward-auth disabled" }}
{{- end }}
{{- if ne (len .Values.ingress.hosts) 1 }}
{{- fail "contourPolicy requires exactly one ingress host" }}
{{- end }}
{{- if empty (get (default (dict) .Values.lanIngress) "trustedNetworks") }}
{{- fail "lanIngress.trustedNetworks must be set" }}
{{- end }}
{{- $policy := .Values.ingress.contourPolicy }}
{{- if not (has $policy (list "trustedLan" "protectedLan")) }}
{{- fail "unsupported contourPolicy" }}
{{- end }}
{{- $fullName := include "external-svc.fullname" . }}
{{- $upstreamPort := $.Values.server.port }}
{{- range .Values.ingress.hosts }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "external-svc.labels" $ | nindent 4 }}
spec:
  ingressClassName: contour
  virtualhost:
    fqdn: {{ tpl .host $ | quote }}
    tls:
      secretName: {{ (first $.Values.ingress.tls).secretName }}
  routes:
    {{- /* These exact paths precede Authelia's network rules. */}}
    {{- range list "/health" "/healthz" "/ready" "/readyz" "/api/info" "/api/greader.php" }}
    - conditions:
        - exact: {{ . | quote }}
      services:
        - name: {{ $fullName }}
          port: {{ $upstreamPort }}
          {{- with $.Values.ingress.upstreamProtocol }}
          protocol: {{ . }}
          {{- end }}
    {{- end }}
    {{- range .paths }}
    {{- if and (eq $policy "protectedLan") (not .service) }}
    {{- fail "protectedLan requires an authentication proxy backend on every path" }}
    {{- end }}
    - conditions:
        - prefix: {{ .path | quote }}
      enableWebsockets: true
      timeoutPolicy:
        response: {{ default "60s" $.Values.ingress.responseTimeout }}
        idle: 3600s
      ipAllowPolicy:
        {{- range required "lanIngress.trustedNetworks must be set" $.Values.lanIngress.trustedNetworks }}
        - cidr: {{ . | quote }}
          source: Peer
        {{- end }}
      services:
        {{- if .service }}
        - name: {{ .service.name }}
          port: {{ .service.port }}
          {{- with .service.protocol }}
          protocol: {{ . }}
          {{- end }}
        {{- else }}
        - name: {{ $fullName }}
          port: {{ $upstreamPort }}
          {{- with $.Values.ingress.upstreamProtocol }}
          protocol: {{ . }}
          {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
