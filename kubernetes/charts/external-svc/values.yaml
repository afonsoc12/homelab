---
# Default values for external-svc.

# Labels applied to all templates
labels: {}
# External server configuration
server:
  # Optional PEM trust bundle from encrypted values, rendered as an Opaque Secret.
  caCertificate: ""
  # ip: "{{ .Values.ips.example }}"
  # port: 8080
  protocol: TCP

# Ingress configuration
ingress:
  enabled: false
  tlsPassthrough: false
  className: "contour"
  annotations: {}
  # hosts:
  #   - host: chart-example.local
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
