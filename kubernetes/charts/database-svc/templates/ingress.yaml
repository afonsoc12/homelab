{{- if .Values.ingress.enabled -}}
{{- if ne .Values.ingress.className "contour" -}}
{{- fail "Ingress requires the contour class; configure native SSO or a proxy backend for authentication" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "database-svc.fullname" . }}
  labels:
    {{- include "database-svc.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl (.host | quote) $ }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "database-svc.fullname" $ }}
                {{- with (first $.Values.ports) | required "Must specify at least one in .Values.ports"  }}
                port:
                  number: {{ .containerPort }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
