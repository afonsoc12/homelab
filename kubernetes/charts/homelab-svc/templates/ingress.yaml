{{- if .Values.ingress.enabled -}}
{{- if ne .Values.ingress.className "contour" -}}
{{- fail "Ingress requires the contour class; configure native SSO or a proxy backend for authentication" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homelab-svc.fullname" . }}
  labels:
    {{- include "homelab-svc.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    {{- $tlsHosts := default (list) .hosts }}
    {{- if and (empty $tlsHosts) (eq $.Values.ingress.className "contour") }}
    {{- range $.Values.ingress.hosts }}
    {{- $tlsHosts = append $tlsHosts .host }}
    {{- end }}
    {{- end }}
    - hosts:
        {{- range $tlsHosts }}
        - {{ tpl (. | quote) $ }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ tpl (.host | quote) $ }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if .service }}
                name: {{ .service.name }}
                port:
                  number: {{ .service.port }}
                {{- else }}
                name: {{ include "homelab-svc.fullname" $ }}
                {{- with (first $.Values.ports) | required "Must specify at least one in .Values.ports" }}
                port:
                  number: {{ .containerPort }}
                {{- end }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
