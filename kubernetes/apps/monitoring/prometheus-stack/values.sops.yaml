          - name: promstack-prometheus
            port: 9090
        - conditions:
          - exact: /api/greader.php
          services:
          - name: promstack-prometheus
            port: 9090
        - conditions:
          - prefix: /
          services:
          - name: promstack-prometheus
            port: 9090
          ipAllowPolicy:
      {{- range .Values.lanIngress.trustedNetworks }}
