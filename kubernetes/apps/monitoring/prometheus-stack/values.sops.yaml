          fqdn: prometheus.local.{{ .Values.domain }}
          tls:
            secretName: local-wildcard-cert
        routes:
        - conditions:
          - exact: /health
          services:
          - name: promstack-prometheus
            port: 9090
        - conditions:
          - exact: /healthz
          services:
          - name: promstack-prometheus
            port: 9090
        - conditions:
          - exact: /ready
          services:
          - name: promstack-prometheus
            port: 9090
        - conditions:
