          - name: promstack-alertmanager
            port: 9093
        - conditions:
          - exact: /ready
          services:
          - name: promstack-alertmanager
            port: 9093
        - conditions:
          - exact: /readyz
          services:
          - name: promstack-alertmanager
            port: 9093
        - conditions:
          - exact: /api/info
          services:
          - name: promstack-alertmanager
            port: 9093
        - conditions:
          - exact: /api/greader.php
          services:
          - name: promstack-alertmanager
            port: 9093
        - conditions:
          - prefix: /
          services:
          - name: promstack-alertmanager
            port: 9093
          ipAllowPolicy:
      {{- range .Values.lanIngress.trustedNetworks }}
            - cidr: {{ . | quote }}
