deploymentStrategy:
    type: Recreate
ingress:
    enabled: true
    ingressClassName: contour
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/websocket-routes: /
    projectcontour.io/response-timeout: 60s
    path: /
    pathType: Prefix
    hosts:
        - ENC[AES256_GCM,data:WRSHbTGpPB4mVa4u/p8FLkN2WBtRzMexxoNU,iv:Ml+lloNRdy7H7YtFInxRDHgCvlz6dwSi3JaQJTEtgJU=,tag:NI66op7wNDcLPglLWDcXsQ==,type:str]
    tls:
        - secretName: local-wildcard-cert
          hosts:
            - ENC[AES256_GCM,data:ueh4kBOqUBYG3QDKK8dUDBAUa4a2CNsosmD0,iv:Bs41l2vUeOkrHLZF+tjGy/zlwwYHxhS3K0gadCened8=,tag:AlS7fjQComThgWHSjYw/yA==,type:str]
persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    size: 1Gi
initChownData:
    enabled: true
env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
grafana.ini:
    paths:
        data: /var/lib/grafana/
        logs: /var/log/grafana
        plugins: /var/lib/grafana/plugins
        provisioning: /etc/grafana/provisioning
    analytics:
        check_for_updates: true
    log:
        mode: console
    grafana_net:
        url: https://grafana.net
    server:
        domain: '{{ .Values.ingress.hosts | first }}'
        root_url: https://{{ .Values.ingress.hosts | first }}
    auth:
        signout_redirect_url: https://sso.{{ .Values.domain }}/application/o/grafana/end-session/
        disable_login_form: true
        oauth_allow_insecure_email_lookup: false
    auth.anonymous:
        enabled: false
    auth.proxy:
        enabled: false
    auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        auto_login: true
        client_id: grafana
        scopes: openid profile email offline_access
        auth_url: https://sso.{{ .Values.domain }}/application/o/authorize/
        token_url: https://sso.{{ .Values.domain }}/application/o/token/
        api_url: https://sso.{{ .Values.domain }}/application/o/userinfo/
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email
        role_attribute_path: ENC[AES256_GCM,data:POCTNPjkWgiIcJVM8x6oWSmrHsYgLEI+V8bp7bVVXDFKta/bFzA0oc7tSAISEeSLUjsdWj8eb8TbPUtHMxTz7e69ozRQlBkrQByTBr43wpjSc3ILpanFNiL4DZK2KQe+kSVD2umPsA==,iv:5Hydk3bHcUihDfpuuVk6iQsfwf0AfPrQMuAthSzxI58=,tag:01UMmjltKRLkYolmaIIp+A==,type:str]
        allow_assign_grafana_admin: true
        role_attribute_strict: true
        use_pkce: true
        use_refresh_token: true
        auth_style: InHeader
    auth.basic:
        enabled: false
ldap:
    enabled: false
    existingSecret: ""
    config: ""
smtp:
    existingSecret: ""
    userKey: user
    passwordKey: password
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 200m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/health
        port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
envRenderSecret:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ENC[AES256_GCM,data:fuoYc4BIoC2KnpKinOsnCPvlxfXWbC3E8/eexe9atNnuC5d3cUh/oF5j2ImoYdStyhWxBCzg/HiRaBPuT/d0Rg==,iv:oER13EnkZEBBgTwzAz0DgOq3fpTxo1CxnyOjzS4H0mI=,tag:LmIqwrWkAT+rCc73m95HAw==,type:str]
