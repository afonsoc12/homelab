deploymentStrategy:
    type: Recreate
ingress:
    enabled: false
persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    size: 1Gi
initChownData:
    enabled: true
env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
grafana.ini:
    paths:
        data: /var/lib/grafana/
        logs: /var/log/grafana
        plugins: /var/lib/grafana/plugins
        provisioning: /etc/grafana/provisioning
    analytics:
        check_for_updates: true
    log:
        mode: console
    grafana_net:
        url: https://grafana.net
    server:
        domain: '{{ .Values.route.main.hostnames | first }}'
        root_url: https://{{ .Values.route.main.hostnames | first }}
    auth:
        signout_redirect_url: https://sso.{{ .Values.domain }}/application/o/grafana/end-session/
    auth.anonymous:
        enabled: false
    auth.proxy:
        enabled: false
    auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        auto_login: true
        client_id: grafana
        scopes: openid profile email offline_access
        auth_url: https://sso.{{ .Values.domain }}/application/o/authorize/
        token_url: https://sso.{{ .Values.domain }}/application/o/token/
        api_url: https://sso.{{ .Values.domain }}/application/o/userinfo/
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email
        role_attribute_path: contains(groups[*], 'authentik_admins') && 'Admin' || 'Viewer'
        use_pkce: true
        use_refresh_token: true
        auth_style: InHeader
ldap:
    enabled: false
    existingSecret: ""
    config: ""
smtp:
    existingSecret: ""
    userKey: user
    passwordKey: password
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 200m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/health
        port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
route:
    main:
        enabled: true
        hostnames:
            - ENC[AES256_GCM,data:zXqLD/I8QREyq4Cjf4DSOphUjidvHKBZYpjh,iv:wxzfKR47iofm8pyRQO2kdX6Wh62cJvABgqGu+0xz8gU=,tag:2pHtqdLWiPKyX4F8L9PLFQ==,type:str]
        parentRefs:
            - name: homelab
              namespace: ingress
              sectionName: https
        annotations:
            argocd.argoproj.io/sync-wave: "1"
    http:
        enabled: true
        hostnames:
            - ENC[AES256_GCM,data:8tcwh5cjiLa2wQItO0WPw6ct6g90iDoF023F2+8/kP131ao3sHf5vY2y,iv:bByP40WFvYh9Sa78Vsn1lp+KiGN9jeZVn4i32WLjBAk=,tag:jDlgFUB2nSxBt+aLwx4gKQ==,type:str]
        parentRefs:
            - name: homelab
              namespace: ingress
              sectionName: http
        httpsRedirect: true
        annotations:
            argocd.argoproj.io/sync-wave: "1"
extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: grafana-gateway
      spec:
        type: ExternalName
        externalName: envoy.ingress.svc.cluster.local
        ports:
            - name: https
              port: 443
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: grafana
        namespace: monitoring
        annotations:
            argocd.argoproj.io/sync-wave: "2"
            nginx.ingress.kubernetes.io/backend-protocol: HTTPS
            nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
            nginx.ingress.kubernetes.io/proxy-ssl-name: '{{ .Values.route.main.hostnames | first }}'
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
      spec:
        ingressClassName: nginx
        tls:
            - secretName: local-wildcard-cert
              hosts:
                - ENC[AES256_GCM,data:qSPQSB7ZzTuYmBwhfqVQE7Z98bknX8BJGLLn/q/hejyOHUJSMcuBNq2i,iv:dYTbsJ8wdBLnjS353aoTHMs48gxQikyoQ9EeHE0cMO0=,tag:BJjy2FwNVDWIug1GUtlN6g==,type:str]
        rules:
            - host: '{{ .Values.route.main.hostnames | first }}'
              http:
                paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                            name: grafana-gateway
                            port:
                                number: 443
