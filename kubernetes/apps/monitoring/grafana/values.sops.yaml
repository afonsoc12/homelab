deploymentStrategy:
    type: Recreate
ingress:
    enabled: true
    ingressClassName: contour
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/websocket-routes: /
    projectcontour.io/response-timeout: 60s
    path: /
    pathType: Prefix
    hosts:
        - ENC[AES256_GCM,data:V3LmtO3N3pl8+NVVrTwa36OMS0EVga4MU06G,iv:VyhDLCCs99iwTBdZzscBMbfWLS96lY747IW5R6QYkJc=,tag:dwjI+odDbhqhQV0AN9CyqA==,type:str]
    tls:
        - secretName: local-wildcard-cert
          hosts:
            - ENC[AES256_GCM,data:AFnK4d0TCct2Mj+WxG2IA2jXZxRrN6DWLSQ6,iv:R1NnxHraQui+5UFsW6miLtMm+zEWxe9UdDSohWRXApk=,tag:wIZXPOOEz0B4OUsc+3ktzw==,type:str]
persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    size: 1Gi
initChownData:
    enabled: true
env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
grafana.ini:
    paths:
        data: /var/lib/grafana/
        logs: /var/log/grafana
        plugins: /var/lib/grafana/plugins
        provisioning: /etc/grafana/provisioning
    analytics:
        check_for_updates: true
    log:
        mode: console
    grafana_net:
        url: https://grafana.net
    server:
        domain: '{{ .Values.ingress.hosts | first }}'
        root_url: https://{{ .Values.ingress.hosts | first }}
    auth:
        signout_redirect_url: https://sso.{{ .Values.domain }}/application/o/grafana/end-session/
        disable_login_form: true
    auth.anonymous:
        enabled: false
    auth.proxy:
        enabled: false
    auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        auto_login: true
        client_id: grafana
        scopes: openid profile email offline_access
        auth_url: https://sso.{{ .Values.domain }}/application/o/authorize/
        token_url: https://sso.{{ .Values.domain }}/application/o/token/
        api_url: https://sso.{{ .Values.domain }}/application/o/userinfo/
        login_attribute_path: preferred_username
        name_attribute_path: name
        email_attribute_path: email
        role_attribute_path: contains(groups[*], 'authentik_admins') && 'Admin' || 'Viewer'
        use_pkce: true
        use_refresh_token: true
        auth_style: InHeader
    auth.basic:
        enabled: false
ldap:
    enabled: false
    existingSecret: ""
    config: ""
smtp:
    existingSecret: ""
    userKey: user
    passwordKey: password
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 200m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/health
        port: 3000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/health
        port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
envRenderSecret:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ENC[AES256_GCM,data:rAFsl9AfVMEU5QfRDmF7I2H8eo0PsszS7sFmX3xh+Txby173X1GwANW8t1BkV/0h5j5+yKhKM7ZgWUUkzvJoyg==,iv:We0MHMunq22p3l7xvNsB7O4MrOp04ueOpV2X97J3P4U=,tag:XQ4tAYZzBzK5O+SIfNZphw==,type:str]
