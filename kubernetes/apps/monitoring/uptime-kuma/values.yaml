# --------------------
# Uptime Kuma
#   - Repo:           https://github.com/louislam/uptime-kuma
#   - Docs:           https://uptime.kuma.pet/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
---
replicas: 1
revisionHistoryLimit: 0
strategy:
  type: Recreate

image:
  repository: docker.io/louislam/uptime-kuma
  tag: 2.5.11
  pullPolicy: Always

ports:
  - containerPort: 3001
    name: http
    protocol: TCP
    service: true

# Uses ports from .ports section, if service is true
service:
  enabled: true

volumeMounts:
  - name: data
    mountPath: /app/data

volumes:
  - name: data
    mountPvc: true

pvc:
  storageClassName: longhorn-persistent
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

# The shared monitoring Authentik outpost owns the Contour Ingress.
ingress:
  enabled: false

resources:
  limits:
    cpu: 50m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

livenessProbe:
  tcpSocket:
    port: 3001
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  tcpSocket:
    port: 3001
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

startupProbe:
  tcpSocket:
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 18
  timeoutSeconds: 5
