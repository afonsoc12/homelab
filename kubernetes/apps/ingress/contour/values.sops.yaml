fullnameOverride: contour
contour:
    replicaCount: 1
    ingressClass:
        name: contour
        create: true
        default: false
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 300m
            memory: 256Mi
    livenessProbe:
        enabled: true
    readinessProbe:
        enabled: true
    startupProbe:
        enabled: true
        failureThreshold: 30
