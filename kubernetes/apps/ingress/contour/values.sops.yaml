fullnameOverride: contour
contour:
    replicaCount: 1
    ingressClass:
        name: contour
        create: true
        default: false
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 300m
            memory: 256Mi
    livenessProbe:
        enabled: true
    readinessProbe:
        enabled: true
    startupProbe:
        enabled: true
        failureThreshold: 30
envoy:
    kind: deployment
    replicaCount: 1
    nodeSelector:
        kubernetes.io/hostname: k3s-m1
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    livenessProbe:
        enabled: true
    readinessProbe:
        enabled: true
    startupProbe:
        enabled: true
        failureThreshold: 30
    shutdownManager:
        resources:
            requests:
                cpu: 10m
                memory: 32Mi
            limits:
                cpu: 100m
                memory: 128Mi
        startupProbe:
            enabled: true
            failureThreshold: 30
