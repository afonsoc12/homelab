# --------------------
# ingress-nginx
#   - Repo:           https://github.com/kubernetes/ingress-nginx
#   - Docs:           https://kubernetes.github.io/ingress-nginx/
#   - Chart Defaults: https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml
# --------------------
controller:
    kind: Deployment
    replicaCount: 0
    autoscaling:
        enabled: false
    admissionWebhooks:
        enabled: false
    service:
        enabled: false
    resources:
        limits:
            cpu: 200m
            memory: 256Mi
        requests:
            cpu: 50m
            memory: 128Mi
    allowSnippetAnnotations: true
    config:
        # Normalize visitor addresses before they reach authentication policies.
        enable-real-ip: true
        use-forwarded-headers: false
        server-snippet: |
            # Drop requests where Host header doesn't match TLS SNI
            if ($host != $ssl_server_name) {
                return 444;
            }
        forwarded-for-header: CF-Connecting-IP
        proxy-real-ip-cidr: ENC[AES256_GCM,data:HSsiEW6Zk5qFijX2HylRDfQm0C4gTytajdBDImuwXWbI0Oy0lBvMWBnHrxdXYzpu2DAQvqKO8cudSjKXtvNj8sGrP6NheZBXQKa/O8RxRRAvYHmIaPE0zwW5,iv:ZhYxSs8Gjfmxn+sFAu8Q2rQOwPBziWq/6H/KMD7CHu4=,tag:QZ616zi5WgNljONOIyZZzQ==,type:str]
