# --------------------
# ingress-nginx
#   - Repo:           https://github.com/kubernetes/ingress-nginx
#   - Docs:           https://kubernetes.github.io/ingress-nginx/
#   - Chart Defaults: https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml
# --------------------
controller:
    # Must run at least one copy on node k3s-m1 because there is no horizontal distribution
    # https://metallb.universe.tf/usage/#local-traffic-policy
    kind: DaemonSet
    service:
        externalTrafficPolicy: Local
        loadBalancerIP: ENC[AES256_GCM,data:ZP+GyFZyq0M/9HE=,iv:1NxbS/K1nKdb+Q1lZUWfCJS6tHhrAKyjNTM7HFvswFU=,tag:WLLxCHm6dJCPxPfc1LoWwA==,type:str]
    resources:
        limits:
            cpu: 200m
            memory: 256Mi
        requests:
            cpu: 50m
            memory: 128Mi
    allowSnippetAnnotations: true
    config:
        # Normalize visitor addresses before they reach authentication policies.
        enable-real-ip: true
        use-forwarded-headers: false
        server-snippet: |
            # Drop requests where Host header doesn't match TLS SNI
            if ($host != $ssl_server_name) {
                return 444;
            }
        forwarded-for-header: CF-Connecting-IP
        proxy-real-ip-cidr: ENC[AES256_GCM,data:oFEAmNCBbOJRrINocy+mM+EfV7GqRBU9KBbcqjx9OohHRe4hqpPkQlD4uSCju9AsLm+e7+pvZhJHnATqgCJlnAl/MGk2YYY0iSMYlLbbuDDsfYbw5DJGy0FJ,iv:ZhYxSs8Gjfmxn+sFAu8Q2rQOwPBziWq/6H/KMD7CHu4=,tag:hvjDiZAlymr4ZRVhEfhk3g==,type:str]
