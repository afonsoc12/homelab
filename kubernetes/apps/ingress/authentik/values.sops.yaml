## authentik server
server:
    name: server
    # The database-affinity node has capacity for one server replica.
    deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    securityContext:
      fsGroup: 1000
    # Bump when mounted customization files change so subPath mounts are refreshed.
    podAnnotations:
      homelab/customization-revision: "2"
    initContainers:
      - name: prepare-plex-compatibility
        image: ghcr.io/goauthentik/server:2026.8.5
        command: [python, /customization-source/patch_plex.py]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: flow-customizations
            mountPath: /customization-source
            readOnly: true
          - name: customization-runtime
            mountPath: /customization-runtime
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
    volumes:
      - name: flow-customizations
        configMap:
          name: authentik-flow-customizations
          items:
            - key: flow.html
              path: if/flow.html
            - key: flow.js
              path: homelab/flow.js
            - key: patch_plex.py
              path: patch_plex.py
      - name: customization-runtime
        emptyDir: {}
    volumeMounts:
      - name: flow-customizations
        mountPath: /templates
        readOnly: true
      - name: customization-runtime
        mountPath: /authentik/sources/plex/plex.py
        subPath: plex.py
        readOnly: true
    affinity:
        podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
                - namespaces:
                    - databases
                  labelSelector:
                    matchExpressions:
                        - key: app.kubernetes.io/instance
                          operator: In
                          values:
                            - postgres
                  topologyKey: kubernetes.io/hostname
    replicas: 1
    env:
        - name: AUTHENTIK_WEB__WORKERS
          value: "2"
    ingress:
        enabled: true
        annotations:
            ingress.kubernetes.io/force-ssl-redirect: "true"
            projectcontour.io/websocket-routes: /
            projectcontour.io/response-timeout: 60s
        ingressClassName: contour
        hosts:
            - ENC[AES256_GCM,data:sC3oZZWufV6CepEjdsqbgi0=,iv:UCdviQkdvggdiDz6GUKa8VW3zwRlr7Anq7U0a8kj6Qc=,tag:cgRKFYpwuhvjUQxcJUcuyQ==,type:str]
        paths:
            - /
        pathType: Prefix
        tls:
            - secretName: sso-cert
              hosts:
                  - ENC[AES256_GCM,data:sp3Jew/EtPIy1Jtv73teAeE=,iv:ilTTSayh0um9Wf/Gf+QCL/RlwF1yguaJKszN0dwBFs4=,tag:mo8k9l+yH8rlhuXtNXCcDg==,type:str]
    resources:
        requests:
            cpu: 500m
            memory: 512Mi
        limits:
            cpu: "2"
            memory: 2Gi
worker:
    name: worker
    deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    affinity:
        podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    namespaces:
                        - databases
                    labelSelector:
                        matchExpressions:
                            - key: app.kubernetes.io/instance
                              operator: In
                              values:
                                - postgres
                    topologyKey: kubernetes.io/hostname
    replicas: 1
    resources:
        requests:
            cpu: 200m
            memory: 512Mi
        limits:
            cpu: "2"
            memory: 2Gi
serviceAccount:
    create: true
prometheus:
    rules:
        enabled: false
        # -- PrometheusRule namespace
        namespace: ""
        # -- PrometheusRule selector
        selector: {}
        # prometheus: kube-prometheus
        # -- PrometheusRule labels
        labels: {}
        # -- PrometheusRule annotations
        annotations: {}
postgresql:
    enabled: false
redis:
    enabled: false
