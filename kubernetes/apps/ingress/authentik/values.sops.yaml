    email:
        # -- SMTP Server emails are sent from, fully optional
        host: ENC[AES256_GCM,data:pDRtAgFuSGH15m0t/thSUNU=,iv:8j/1poT6iPf84ToH/d9dDdlSDEuSp9HSDoy9HztME4g=,tag:bgEjGPFzxZdei4DM/RZYMg==,type:str]
        # -- SMTP server port
        port: 587
        # -- SMTP credentials, when left empty, no authentication will be done
        username: ENC[AES256_GCM,data:Z8myPmmikKhPPAz927ruNFZs9My4ed9be4G42j20+bY=,iv:wrICyFG1yD7SC6jfDisPywc5KO2LIEB5T8uX9kOOXF0=,tag:ZI0FFCjFBwnn/zUn2MPPkw==,type:str]
        # -- SMTP credentials, when left empty, no authentication will be done
        password: ENC[AES256_GCM,data:WLUHMUXEeDTf3OjS77jG33a/J/vN88FWQFsAlwmCuiE=,iv:4u6UZ+Z/lo9899ZG4eepULM7t0f2h5b6NvjFt8yOMhc=,tag:8bjThNKEw3WlrQefapdQ2A==,type:str]
        use_tls: true
        timeout: 10
        from: ENC[AES256_GCM,data:WUgiZ1Rxxx2BsdaLeYq5WaBArfl0bLEuel2kayPfkSQV,iv:feZzTXM8eimsyMWyurAEnog44s+bcERMz4XeyzFg2jE=,tag:7LkacaAPdMhzPGX49145RQ==,type:str]
    error_reporting:
        enabled: false
        send_pii: false
    postgresql:
        host: ENC[AES256_GCM,data:S89StR2FMTKGVQPH7Dnyk0rL,iv:n5eaVrAnaU/cEV16LNWQhanYrMhIHgJiVPSgM09M2Zc=,tag:DdmTnpxlwM97+4MCBC6t5A==,type:str]
        name: authentik
        user: ENC[AES256_GCM,data:Rl0soLMXz3YN,iv:l+X7SSY+YsZ0o2p7FUNPCPC0+0cVDA8JW5RIpxuzjxc=,tag:8DX+oWSsc0SihdcGFZjvQQ==,type:str]
        password: ENC[AES256_GCM,data:99Ea+Mz/WjuLcRF26vd3zt3+TDs=,iv:TTQU96Ywo+FtBULpII6fGpqMlW7xxZqFG7MYHuMZFl4=,tag:jl9j4ftE0WLcYBBw6Q9oUw==,type:str]
        port: 5432
    redis:
        host: ENC[AES256_GCM,data:/zpx3Gt2QSrwz1vNj68o,iv:MCwdCZfj4QeaKRihEUqcJmUgbp8YZ7m5/gV9w6Dc03A=,tag:A8mbpQSvJOOoqli1LqMpyg==,type:str]
## authentik server
server:
    name: server
    affinity:
        podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    namespaces:
                        - databases
                    labelSelector:
                        matchExpressions:
                            - key: app.kubernetes.io/instance
                              operator: In
                              values:
                                - postgres
                    topologyKey: kubernetes.io/hostname
    replicas: 1
    env:
        - name: AUTHENTIK_WEB__WORKERS
          value: "2"
    ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
            - ENC[AES256_GCM,data:sC3oZZWufV6CepEjdsqbgi0=,iv:UCdviQkdvggdiDz6GUKa8VW3zwRlr7Anq7U0a8kj6Qc=,tag:cgRKFYpwuhvjUQxcJUcuyQ==,type:str]
        paths:
            - /
        pathType: Prefix
        tls:
            - secretName: sso-cert
        extraPaths:
            - backend:
                service:
                    name: authentik-embedded-outpost
                    port:
                        number: 9000
              path: /outpost.goauthentik.io
              pathType: Prefix
    resources:
        requests:
            cpu: "1"
            memory: 512Mi
        limits:
            cpu: "2"
            memory: 2Gi
worker:
    name: worker
    affinity:
        podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    namespaces:
                        - databases
                    labelSelector:
                        matchExpressions:
                            - key: app.kubernetes.io/instance
                              operator: In
                              values:
                                - postgres
                    topologyKey: kubernetes.io/hostname
    replicas: 1
    resources:
        requests:
            cpu: 200m
            memory: 512Mi
        limits:
            cpu: 500m
            memory: 2Gi
serviceAccount:
    create: true
prometheus:
    rules:
        enabled: false
        # -- PrometheusRule namespace
        namespace: ""
        # -- PrometheusRule selector
        selector: {}
        # prometheus: kube-prometheus
        # -- PrometheusRule labels
        labels: {}
        # -- PrometheusRule annotations
        annotations: {}
postgresql:
    enabled: false
redis:
    enabled: false
additionalObjects:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: authentik-outposts
    namespace: automation
  rules:
  - apiGroups:
    - ''
    resources:
    - secrets
    - services
    verbs:
    - get
    - create
    - delete
    - list
    - patch
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - get
    - create
    - delete
    - list
    - patch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: authentik-outposts
    namespace: automation
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: authentik-outposts
  subjects:
  - kind: ServiceAccount
    name: authentik
    namespace: ingress

