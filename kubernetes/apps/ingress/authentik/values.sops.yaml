server:
    name: server
    affinity:
        podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    namespaces:
                        - databases
                    labelSelector:
                        matchExpressions:
                            - key: app.kubernetes.io/instance
                              operator: In
                              values:
                                - postgres
                    topologyKey: kubernetes.io/hostname
    replicas: 1
    env:
        - name: AUTHENTIK_WEB__WORKERS
          value: "2"
    ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
            - ENC[AES256_GCM,data:sC3oZZWufV6CepEjdsqbgi0=,iv:UCdviQkdvggdiDz6GUKa8VW3zwRlr7Anq7U0a8kj6Qc=,tag:cgRKFYpwuhvjUQxcJUcuyQ==,type:str]
        paths:
            - /
        pathType: Prefix
        tls:
            - secretName: sso-cert
        extraPaths:
            - backend:
                service:
                    name: authentik-embedded-outpost
                    port:
                        number: 9000
              path: /outpost.goauthentik.io
              pathType: Prefix
    resources:
        requests:
            cpu: "1"
            memory: 512Mi
        limits:
            cpu: "2"
            memory: 2Gi
worker:
    name: worker
    affinity:
        podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    namespaces:
                        - databases
                    labelSelector:
                        matchExpressions:
                            - key: app.kubernetes.io/instance
                              operator: In
                              values:
                                - postgres
                    topologyKey: kubernetes.io/hostname
    replicas: 1
    resources:
        requests:
            cpu: 200m
            memory: 512Mi
        limits:
            cpu: 500m
            memory: 2Gi
