---
# Account-only Plex authentication for the Terraform-managed source. Plex's
# account token is still validated by its user API before this method runs.
# Authentik 2026.8.5 otherwise rejects an empty server list, even after proving
# account identity. Invitations, MFA, email policies, and app bindings remain
# independent requirements. All other Plex sources retain upstream behavior.
server:
  securityContext:
    fsGroup: 1000
  initContainers:
    - name: plex-account-only
      # Use the same image as the main container, including future overrides.
      # yamllint disable-line rule:line-length
      image: '{{ default .Values.global.image.repository .Values.server.image.repository }}:{{ default (include "authentik.defaultTag" .) .Values.server.image.tag }}{{- if (default .Values.global.image.digest .Values.server.image.digest) -}}@{{ default .Values.global.image.digest .Values.server.image.digest }}{{- end }}'
      command: [python, -c]
      args:
        - |
          import ast
          import hashlib
          from pathlib import Path
          from authentik import authentik_version

          def patch_plex(source, version):
              expected = "df272bb88ebad60953c9fe487cef087c8d20b0c64c456e243ae3e71af30c186a"
              if version != "2026.8.5" or hashlib.sha256(source.encode()).hexdigest() != expected:
                  print("Unreviewed Plex implementation: retaining upstream behavior")
                  return source
              marker = "        try:\n            resources = self.get_resources()"
              if source.count(marker) != 1:
                  print("Unrecognized Plex resource check: retaining upstream behavior")
                  return source
              guard = (
                  "        if (\n"
                  "            self._source.slug == 'plex'\n"
                  "            and not self._source.allowed_servers\n"
                  "            and not self._source.allow_friends\n"
                  "        ):\n"
                  "            return True\n"
              )
              result = source.replace(marker, guard + marker, 1)
              ast.parse(result)
              return result

          original = Path("/authentik/sources/plex/plex.py").read_text()
          result = patch_plex(original, authentik_version())
          target = Path("/plex-patch/plex.py")
          target.write_text(result)
          target.chmod(0o644)
          print("Plex account-only patch active:", result != original)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: plex-account-only
          mountPath: /plex-patch
  volumes:
    - name: plex-account-only
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
  volumeMounts:
    - name: plex-account-only
      mountPath: /authentik/sources/plex/plex.py
      subPath: plex.py
      readOnly: true
