# --------------------
# WireGuard (wg-easy)
#   - Repo:           https://github.com/wg-easy/wg-easy
#   - Docs:           https://github.com/wg-easy/wg-easy
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
---
replicas: 1
revisionHistoryLimit: 0
strategy:
  type: Recreate
image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: 15.5.0
  pullPolicy: Always
#   restartPolicy:
command: {}
args: {}
ports:
  - containerPort: 51821
    name: ui
    protocol: TCP
    service: true
  - containerPort: 51820
    name: vpn
    protocol: UDP
    service: true
# Uses ports from .ports section, if service is true
service:
  enabled: true
  type: LoadBalancer
  annotations:
    metallb.io/address-pool: ip-pool-lan-pt
# configmap:
#     mountEnv: true
#     data:
volumeMounts:
  - mountPath: /etc/wireguard
    name: config
  - mountPath: /lib/modules
    name: lib
    readOnly: true
volumes:
  - name: config
    mountPvc: "yes"
  - name: lib
    hostPath:
      path: /lib/modules
pvc:
  storageClassName: longhorn-persistent
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
ingress:
  enabled: true
  className: contour
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    projectcontour.io/response-timeout: 60s
    projectcontour.io/websocket-routes: /
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: wg.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: authentik-ingress-proxy
            port: 9000

livenessProbe:
  tcpSocket:
    port: 51821
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  tcpSocket:
    port: 51821
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

startupProbe:
  tcpSocket:
    port: 51821
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 18
  timeoutSeconds: 5

resources:
  limits:
    cpu: 50m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi
podSecurityContext: {}
# fsGroup: 2000
securityContext:
  privileged: true
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE
nodeSelector:
  kubernetes.io/hostname: k3s-m2
tolerations: []
affinity: {}

