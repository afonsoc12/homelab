# --------------------
# Longhorn
#   - Repo:           https://github.com/longhorn/longhorn
#   - Docs:           https://longhorn.io/docs/
#   - Chart Defaults: https://github.com/longhorn/longhorn/blob/master/chart/values.yaml
# --------------------
longhornUI:
    # -- Replica count for Longhorn UI.
    replicas: 1
longhornManager:
    # -- Resource requests and limits for Longhorn Manager pods.
    resources:
        requests:
            cpu: 50m
            memory: 128Mi
        limits:
            cpu: 150m
            memory: 384Mi
preUpgradeChecker:
    upgradeVersionCheck: false
upgradeCheck:
    enabled: false
defaultSettings:
    # -- Resource limits for system-managed CSI components (csi-attacher, csi-provisioner,
    # csi-resizer, csi-snapshotter, longhorn-csi-plugin, node-driver-registrar,
    # longhorn-liveness-probe). JSON object keyed by component name with standard
    # Kubernetes ResourceRequirements (requests/limits) as values.
    systemManagedCSIComponentsResourceLimits: '{"csi-attacher":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"csi-provisioner":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"csi-resizer":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"csi-snapshotter":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"node-driver-registrar":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"50m","memory":"64Mi"}}}'
ingress:
    enabled: false
    host: ENC[AES256_GCM,data:3ZZUp26LHuGTqIgDdL991yhmz3Fdvm82LK6/IQ==,iv:UdqfNG4Rcav7n+hp8SAj0KYHXEgOJPMVStV3vEM9RFE=,tag:EHNGU52HphU7fh4J5A3zyQ==,type:str]
extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: longhorn-ui-authentik
      spec:
        podSelector:
            matchLabels:
                app: longhorn-ui
        policyTypes:
            - Ingress
        ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: ingress
                  podSelector:
                    matchLabels:
                        app.kubernetes.io/name: authentik
                        app.kubernetes.io/component: server
              ports:
                - protocol: TCP
                  port: 8000
