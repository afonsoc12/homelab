# --------------------
# Cookistash
#   - Repo:           https://github.com/afonsoc12/cookistash
#   - Docs:           https://github.com/afonsoc12/cookistash/blob/master/README.md
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
nameOverride: ""
fullnameOverride: ""
labels: {}
podAnnotations: {}
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: ghcr.io/afonsoc12/cookistash
    tag: v0.0.2
    pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 8000
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        DB_PASSWORD: ENC[AES256_GCM,data:qWpyrQjNuz9GGTC23Z8D3s0aBOA=,iv:GLZL7JYDK2sHyffXh6FbyFdBLThNnW373YUSrN18ekk=,tag:FaPBj6jmYcwZIkFTO8GAiQ==,type:str]
        MEALIE_API_TOKEN: ENC[AES256_GCM,data:,iv:JQvrIA5trf96eDDHQvFoRdbim+q72nbdXzLQybiUCjo=,tag:PNkBGvX3jy7c9CrrHAZOqQ==,type:str]
configmap:
    mountEnv: true
    data:
        TZ: '{{ .Values.tz }}'
        DEBUG: "false"
        CSRF_TRUSTED_ORIGINS: https://cookistash.local.{{ .Values.domain }}
        DB_HOST: postgres.databases
        DB_USER: cookistash
        CELERY_BROKER_URL: redis://redis.databases:6379/0
        REDIS_CACHE_URL: redis://redis.databases:6379/1
        COOKIDOO_EXPLORE_URL: https://cookidoo.pt/foundation/pt-PT/explore
        MEALIE_API_URL: http://mealie.homelab:9000
        MEALIE_PUBLIC_URL: https://mealie.local.{{ .Values.domain }}
        DATA_DIR: /data
volumeMounts:
    - mountPath: /data
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 50Mi
ingress:
    enabled: true
    authelia: true
    className: nginx
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: cookistash.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: ImplementationSpecific
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity:
    podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                namespaceSelector: {}
                labelSelector:
                    matchExpressions:
                        - key: app.kubernetes.io/instance
                          operator: In
                          values:
                            - postgres
                topologyKey: kubernetes.io/hostname
resources:
    limits:
        cpu: 250m
        memory: 512Mi
    requests:
        cpu: 50m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /
        port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
sops:
    encrypted_regex: ^(stringData)$
    lastmodified: "2026-09-25T17:46:26Z"
