# --------------------
# Cookistash
#   - Repo:           https://github.com/afonsoc12/cookistash
#   - Docs:           https://github.com/afonsoc12/cookistash/blob/master/README.md
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
nameOverride: ""
fullnameOverride: ""
labels: {}
podAnnotations: {}
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: ghcr.io/afonsoc12/cookistash
    tag: v0.0.2
    pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 8000
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        DB_PASSWORD: ENC[AES256_GCM,data:YgFTb4m9VtlCVMckhVR4SvtvqUw=,iv:Ips47gr81yEpUwBF+kdWe+zkYNTLxH4PlLBfI8mivSw=,tag:P/3iyDstOq1ibp3YQrbDWg==,type:str]
        MEALIE_API_TOKEN: ENC[AES256_GCM,data:,iv:z25C7NNYRpAXwixoNhH6uiVkFOG/1SXEM9+ZnYE0uTk=,tag:kAdnsNeR58tq7o1aKsidGw==,type:str]
configmap:
    mountEnv: true
    data:
        TZ: '{{ .Values.tz }}'
        DEBUG: "false"
        ALLOWED_HOSTS: '*'
        CSRF_TRUSTED_ORIGINS: https://cookistash.local.{{ .Values.domain }}
        DB_HOST: postgres.databases
        DB_PORT: "5432"
        DB_NAME: cookistash
        DB_USER: cookistash
        CELERY_BROKER_URL: redis://redis.databases:6379/0
        CELERY_RESULT_BACKEND: django-db
        REDIS_CACHE_URL: redis://redis.databases:6379/1
        COOKIDOO_EXPLORE_URL: https://cookidoo.pt/foundation/pt-PT/explore
        MEALIE_API_URL: http://mealie.homelab:9000
        MEALIE_PUBLIC_URL: https://mealie.local.{{ .Values.domain }}
        MEALIE_GROUP_SLUG: home
        DATA_DIR: /data
        # Ingress terminates behind Authelia, safe to auto-authenticate as
        # the superuser rather than showing a second login form.
        AUTO_ADMIN_LOGIN: "true"
volumeMounts:
    - mountPath: /data
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 50Mi
ingress:
    enabled: true
    authelia: true
    className: nginx
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: cookistash.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: ImplementationSpecific
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity:
    podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                namespaceSelector: {}
                labelSelector:
                    matchExpressions:
                        - key: app.kubernetes.io/instance
                          operator: In
                          values:
                            - postgres
                topologyKey: kubernetes.io/hostname
resources:
    limits:
        cpu: 250m
        memory: 512Mi
    requests:
        cpu: 50m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /
        port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
