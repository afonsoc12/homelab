replicas: 1
image:
    repository: ghcr.io/linuxserver/freshrss
    tag: 1.30.4
strategy:
    type: Recreate
ports:
    - containerPort: 80
      service: true
service:
    enabled: true
volumeMounts:
    - name: config
      mountPath: /config
volumes:
    - name: config
      mountPvc: true
pvc:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
ingress:
    enabled: true
    className: contour
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
    tls:
        - secretName: rss-cert
    hosts:
        - host: rss.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-homelab-proxy
                port: 9000
mydomain: '{{ .Values.local.domain }}'
resources:
    limits:
        cpu: 50m
        memory: 160Mi
    requests:
        cpu: 25m
        memory: 80Mi
livenessProbe:
    httpGet:
        path: /
        port: 80
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        port: 80
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /
        port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
