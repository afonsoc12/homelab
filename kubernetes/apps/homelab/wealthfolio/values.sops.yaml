replicas: 1
revisionHistoryLimit: 0
enableServiceLinks: false
strategy:
    type: Recreate
image:
    repository: docker.io/wealthfolio/wealthfolio
    tag: 3.12.0
    pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 8088
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        WF_SECRET_KEY: ENC[AES256_GCM,data:W1V2k6LN2N9RlzyscniV+NmXRja1MHo/CXSZ0zZRUSht8P5J2BNubOMPgY4=,iv:GSAQEHRjA525VCbCAaiFjZvrFXQBa+9y/bggr67867g=,tag:RIX1PLGyqbMlRNzFQfdQRA==,type:str]
        WF_AUTH_PASSWORD_HASH: ENC[AES256_GCM,data:xUFxMuvNoHfhgNFuEqHBwFQGOkip13c1ytY21ZDYucaB8g1bG901UXKICrvLkGUdFEW4NFQmJP5OS16GNLOUW6dLMIkzFeX2kQVe2IL9X/NdYSferTvIC39RbAtWIARJgQ==,iv:H8g9v4DiNOiOrVorH7nBaAiiSsmTWoSTJ1oyyDC7VQQ=,tag:TVBGFiRf+7Rmkxs1Oerljg==,type:str]
configmap:
    mountEnv: true
    data:
        WF_LISTEN_ADDR: 0.0.0.0:8088
        WF_DB_PATH: /data/wealthfolio.db
        WF_AUTH_REQUIRED: "true"
        WF_CORS_ALLOW_ORIGINS: https://wealth.local.{{ .Values.domain }}
volumeMounts:
    - mountPath: /data
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: wealth.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-homelab-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 60s
livenessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
startupProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
readinessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 100m
        memory: 128Mi
podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
nodeSelector: {}
tolerations: []
affinity: {}
