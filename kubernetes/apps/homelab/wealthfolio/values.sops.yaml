        WF_OIDC_CLIENT_ID: ENC[AES256_GCM,data:CYApmYUmdUWBh+8=,iv:Ucatiic3BRcp/k5Qs7nrqRVpFK61ySuB9Haqm2LeN34=,tag:sRwM4gleGao+xONLVGcs4w==,type:str]
        WF_OIDC_CLIENT_SECRET: ENC[AES256_GCM,data:cN8njEtdD+SOlVCdPq9mPtYk9Fvco9tUv7443KVmGKgJVmiv0GPjGnI0NLwbGD4FU6YAC7gOcEz1TyN4JLs6hw==,iv:KyQcVtJCuw89JIBuconTQ4JlG+z32oxj//ZLpnQ5LzA=,tag:gGGpSdbd8mS7ZQ/bRm547A==,type:str]
        WF_OIDC_REDIRECT_URL: ENC[AES256_GCM,data:dAto6sjGyt+Ptq4sCEVuLR3PdMB+o/oV94VW0yyBAeslfcyZB0W2K4pOV46Ynnl8Ga2kot8RugpLrahZ,iv:jCcGxqmoAwIQP2MRT+MOpnp3uESHdMafhZlmxaIjH8g=,tag:e4itpdtFMQ3sJaHuQpgpgg==,type:str]
configmap:
    mountEnv: true
    data:
        WF_LISTEN_ADDR: 0.0.0.0:8088
        WF_DB_PATH: /data/wealthfolio.db
        WF_AUTH_REQUIRED: "true"
        WF_CORS_ALLOW_ORIGINS: https://wealth.local.{{ .Values.domain }}
volumeMounts:
    - mountPath: /data
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
ingress:
  enabled: true
  className: contour
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: wealth.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: authentik-homelab-proxy
            port: 9000
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    projectcontour.io/response-timeout: 60s

livenessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
startupProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
readinessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 100m
        memory: 128Mi
podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
nodeSelector: {}
tolerations: []
affinity: {}
