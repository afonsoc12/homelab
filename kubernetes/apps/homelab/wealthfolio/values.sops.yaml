replicas: 1
revisionHistoryLimit: 0
enableServiceLinks: false
strategy:
    type: Recreate
image:
    repository: docker.io/wealthfolio/wealthfolio
    tag: 3.12.0
    pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 8088
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        WF_SECRET_KEY: ENC[AES256_GCM,data:bhBrYE1tTU8lqatjs2ApNyp8BwJ1PAZEEj/XIl7sN72+yEm6s0rqrRPB6ek=,iv:KY3qXgJFsLOV52yWyXCFC1jXv9Rqs/inByUCgGX+2cQ=,tag:SRhNayfS/vrbyfExhfR6NA==,type:str]
        WF_AUTH_PASSWORD_HASH: ENC[AES256_GCM,data:9RfpDHS7BnY6zkXKl/1GaTRKfD1V59DQIlDEdFRe3rh+N3cxyASjp8y2AkELIGDqoKk0bWyFFCYfWsxinirPyUoie/iVAtSnCwdOVLj4Kkr+upZ1svmY49Bw2uXaJuq1cQ==,iv:L6VJCwn1mSZNUonP0JHfZYSLBGcejeADMswgrIJNUZM=,tag:Mm2iIgddCpY5O8k+FXli2g==,type:str]
configmap:
    mountEnv: true
    data:
        WF_LISTEN_ADDR: 0.0.0.0:8088
        WF_DB_PATH: /data/wealthfolio.db
        WF_AUTH_REQUIRED: "true"
        WF_CORS_ALLOW_ORIGINS: https://wealth.local.{{ .Values.domain }}
volumeMounts:
    - mountPath: /data
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: wealth.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-homelab-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 60s
livenessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
startupProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
readinessProbe:
    httpGet:
        path: /api/v1/healthz
        port: 8088
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 100m
        memory: 128Mi
podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
nodeSelector: {}
tolerations: []
affinity: {}
