# --------------------
# Wealthfolio
#   - Repo:           https://github.com/afadil/wealthfolio
#   - Docs:           https://wealthfolio.app/docs/self-hosting/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
#   - Notes:          SQLite-only (no Postgres). DB persisted on a Longhorn PVC at /data.
# --------------------
replicas: 1
revisionHistoryLimit: 0
enableServiceLinks: false
strategy:
    type: Recreate
image:
    repository: docker.io/wealthfolio/wealthfolio
    tag: 3.13.1
    pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 8088
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        WF_SECRET_KEY: ENC[AES256_GCM,data:xXuyWHzAYVGlkHjx1pZjeGY30Zn3KOqTh+7yb20VY6nYd2wdq3SUBaMuF+c=,iv:eYAPKQAe5d1rqgfTa0FXbO9s8lmvXVxR8XGPDSo4YlA=,tag:KTXsADL4bAdeAgE49QL1GA==,type:str]
