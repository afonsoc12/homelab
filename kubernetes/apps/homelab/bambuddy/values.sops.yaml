configmap:
    mountEnv: true
    data:
        BAMBUDDY_OIDC_ENABLED: "false"
        BAMBUDDY_OIDC_SCOPES: openid email profile
        BAMBUDDY_OIDC_AUTO_CREATE_USERS: "false"
        BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "false"
        BAMBUDDY_OIDC_EMAIL_CLAIM: email
        BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
        BAMBUDDY_OIDC_AUTOLOGIN: "false"
        BAMBUDDY_OIDC_GROUP_MAPPING: '{}'
volumeMounts:
    - mountPath: /app/data
      subPath: data
      name: data
    - mountPath: /app/logs
      subPath: logs
      name: data
volumes:
    - name: data
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: bambu.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-homelab-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 300s
        projectcontour.io/websocket-routes: /
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 50m
        memory: 256Mi
livenessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /
        port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 60
    timeoutSeconds: 5
