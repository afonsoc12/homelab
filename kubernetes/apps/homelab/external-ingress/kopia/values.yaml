# --------------------
# Kopia
#   - Repo:           https://github.com/kopia/kopia
#   - Docs:           https://kopia.io/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/external-svc/values.yaml
# --------------------
---
# Default values for external-service.

# Labels applied to all templates
labels:
  host: hoarder

# External server configuration
server:
  ip: "{{ .Values.ips_tailscale.hoarder }}"
  port: 51515

# Ingress configuration
ingress:
  enabled: true
  authelia: false
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: 'true'
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: kopia.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: kopia-auth-proxy
            port: 8080
            protocol: h2c
  className: contour
  contourPolicy: protectedLan
  upstreamProtocol: h2


extraResources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kopia-auth-proxy
    data:
      envoy.yaml: |
        admin:
          access_log_path: /dev/null
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9901
        static_resources:
          listeners:
            - name: kopia
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 8080
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: kopia
                        codec_type: AUTO
                        use_remote_address: true
                        route_config:
                          name: kopia
                          virtual_hosts:
                            - name: kopia
                              domains:
                                - '*'
                              routes:
                                - match:
                                    prefix: /outpost.goauthentik.io/
                                  route:
                                    cluster: authentik
                                  typed_per_filter_config:
                                    envoy.filters.http.ext_authz:
                                      '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                      disabled: true
                                - match:
                                    prefix: /
                                  route:
                                    cluster: kopia
                                    timeout: 0s
                        http_filters:
                          - name: envoy.filters.http.ext_authz
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                              failure_mode_allow: false
                              clear_route_cache: false
                              http_service:
                                server_uri:
                                  uri: http://authentik-homelab-proxy:9000
                                  cluster: authentik
                                  timeout: 5s
                                path_prefix: /outpost.goauthentik.io/auth/envoy
                                authorization_request:
                                  allowed_headers:
                                    patterns:
                                      - exact: cookie
                                      - exact: authorization
                                      - exact: x-forwarded-proto
                                authorization_response:
                                  allowed_upstream_headers:
                                    patterns:
                                      - prefix: x-authentik-
                                  allowed_client_headers:
                                    patterns:
                                      - exact: location
                                      - exact: set-cookie
                                      - exact: content-type
                                  allowed_client_headers_on_success:
                                    patterns:
                                      - exact: set-cookie
                          - name: envoy.filters.http.router
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          clusters:
            - name: kopia
              connect_timeout: 5s
              type: STRICT_DNS
              load_assignment:
                cluster_name: kopia
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: kopia-external-external-svc
                              port_value: 51515
              typed_extension_protocol_options:
                envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
                  '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
                  explicit_http_config:
                    http2_protocol_options: {}
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                  common_tls_context:
                    alpn_protocols:
                      - h2
            - name: authentik
              connect_timeout: 5s
              type: STRICT_DNS
              load_assignment:
                cluster_name: authentik
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: authentik-homelab-proxy
                              port_value: 9000
  - apiVersion: v1
    kind: Service
    metadata:
      name: kopia-auth-proxy
    spec:
      selector: &id001
        app.kubernetes.io/name: kopia-auth-proxy
      ports:
        - name: http
          port: 8080
          targetPort: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kopia-auth-proxy
    spec:
      replicas: 1
      revisionHistoryLimit: 1
      selector:
        matchLabels: *id001
      template:
        metadata:
          labels: *id001
        spec:
          containers:
            - name: envoy
              image: docker.io/envoyproxy/envoy:v1.38.9
              args:
                - -c
                - /etc/envoy/envoy.yaml
                - --log-level
                - warning
              ports:
                - name: http
                  containerPort: 8080
                - name: admin
                  containerPort: 9901
              volumeMounts:
                - name: config
                  mountPath: /etc/envoy
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 300m
                  memory: 128Mi
              readinessProbe:
                httpGet:
                  path: /ready
                  port: admin
              livenessProbe:
                httpGet:
                  path: /server_info
                  port: admin
              startupProbe:
                httpGet:
                  path: /ready
                  port: admin
                failureThreshold: 30
                periodSeconds: 2
          volumes:
            - name: config
              configMap:
                name: kopia-auth-proxy
