# --------------------
# Plex
#   - Repo:           https://github.com/plexinc/pms-docker
#   - Docs:           https://support.plex.tv/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/external-svc/values.yaml
# --------------------
---
# Default values for external-service.

# Labels applied to all templates
labels:
  host: hoarder

# External server configuration
server:
  ip: "{{ .Values.ips_tailscale.hoarder }}"
  port: 32400

# Ingress configuration
ingress:
  enabled: true
  className: contour
  # Native Plex tokens authenticate media clients; preserve streaming/WebSockets.
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    projectcontour.io/websocket-routes: /
    projectcontour.io/response-timeout: infinity
  tls:
    - secretName: plex-cert
  hosts:
    - host: plex.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
