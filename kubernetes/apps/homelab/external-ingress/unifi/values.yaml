# --------------------
# UniFi
#   - Repo:           https://github.com/linuxserver/docker-unifi-network-application
#   - Docs:           https://ui.com/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/external-svc/values.yaml
# --------------------
---
# Default values for external-service.

# Labels applied to all templates
labels:
  host: unifi

# External server configuration
server:
  ip: "{{ .Values.ips.unifi }}"
  port: 443
  caCertificate: "{{ .Values.upstream_tls.unifi.ca }}"

# Ingress configuration
ingress:
  enabled: true
  className: contour
  authelia: false
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    projectcontour.io/websocket-routes: /
    projectcontour.io/response-timeout: 300s
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: unifi.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: authentik-unifi-proxy
            port: 9000
