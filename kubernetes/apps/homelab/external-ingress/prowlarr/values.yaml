# --------------------
# Prowlarr
#   - Repo:           https://github.com/Prowlarr/Prowlarr
#   - Docs:           https://wiki.servarr.com/prowlarr
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/external-svc/values.yaml
# --------------------
---
# Default values for external-service.

# Labels applied to all templates
labels:
  host: hoarder

# External server configuration
server:
  ip: "{{ .Values.ips_tailscale.hoarder }}"
  port: 9696

# Ingress configuration
ingress:
  enabled: true
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: prowlarr.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: authentik-homelab-proxy
            port: 9000
  className: contour
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    projectcontour.io/response-timeout: 60s
