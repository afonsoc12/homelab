# --------------------
# Scrutiny
#   - Repo:           https://github.com/AnalogJ/scrutiny
#   - Docs:           https://github.com/AnalogJ/scrutiny
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/external-svc/values.yaml
# --------------------
---
labels:
  host: hoarder

server:
  ip: "{{ .Values.ips_tailscale.hoarder }}"
  port: 8084

ingress:
  enabled: true
  authelia: false
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: scrutiny.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
          service:
            name: authentik-homelab-proxy
            port: 9000
  className: contour
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    projectcontour.io/response-timeout: 60s
