# --------------------
# Paperless-ngx
#   - Repo:           https://github.com/paperless-ngx/paperless-ngx
#   - Docs:           https://docs.paperless-ngx.com/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: 3.0.5
    pullPolicy: Always
ports:
    - containerPort: 8000
      name: http
      protocol: TCP
      service: true
additionalContainers:
    - name: gotenberg
      image: docker.io/gotenberg/gotenberg:8
      command:
        - gotenberg
        - --chromium-disable-javascript=true
        - --chromium-allow-list=file:///tmp/.*
      resources:
        requests:
            cpu: 10m
            memory: 128Mi
        limits:
            cpu: 500m
            memory: 512Mi
    - name: tika
      image: docker.io/apache/tika:latest-full
      ports:
        - containerPort: 9998
          name: tika
          protocol: TCP
      resources:
        requests:
            cpu: 10m
            memory: 256Mi
        limits:
            cpu: 500m
            memory: 1Gi
service:
    enabled: true
secret:
    mountEnv: true
    stringData:
        PAPERLESS_DBUSER: ENC[AES256_GCM,data:tYBNxc8TD5Ym,iv:oEangT588jDNtT2XSlrOYZIhlOa+xB1R3nBzy9ZTWWo=,tag:6TfpA0b7QLcNmYAlDT93oA==,type:str]
        PAPERLESS_DBPASS: ENC[AES256_GCM,data:R6vzXipbXZa+ljbfUVHAtPfkcEY=,iv:TQuk3dDnYiPc40TCCmwcgbdfA/dE6dtptcqEKZcGcZ0=,tag:1vJ/GxgXBD683d/WJQKarQ==,type:str]
        PAPERLESS_SECRET_KEY: ENC[AES256_GCM,data:gKsyS2dQMkpEQMkcqGw5qYOxtLYOZ0nlpA9ie9/DHxOqEW6zvqC6VeLeI8cUtdqESCV6T+eke14u+z/yKEoLbg==,iv:hP72OO9K5H6gr7a5Kco9nhdIU4e0Js8yuLh4C+gv7vM=,tag:OtTwnJ0fGXMeyE5xUVr/0A==,type:str]
        PAPERLESS_ADMIN_USER: ENC[AES256_GCM,data:p4ONsb4Q,iv:nSfCglwPObtWd9fUSWSDmbn/zrzuCUdjK8dINLwk1QE=,tag:wN/i0evlNAt+fw1fFvVWTA==,type:str]
        PAPERLESS_ADMIN_PASSWORD: ENC[AES256_GCM,data:EQ+h/emi/MC+vlmhKGtlOI4Fba2+hANq,iv:MlYN7UTZIIhmrxNaB/yDE1RysKk2TVBuDQzcHnDKvYg=,tag:MxLz8Cu2mgTcGIu5mT5Fqw==,type:str]
        PAPERLESS_ADMIN_MAIL: ENC[AES256_GCM,data:ups1gUU6IW4HmE0CBsbwNR29bd+bWLrYSl4=,iv:3UQ+a/N17zlpdM+f+HibvVTZTBD7jDl0R4H76Az1si0=,tag:stiBE5YmhHfMsYlUmHbJmA==,type:str]
configmap:
    mountEnv: true
    data:
        PAPERLESS_URL: https://paperless.local.{{ .Values.domain }}
        PAPERLESS_DBHOST: postgres.databases
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBNAME: paperless
        PAPERLESS_REDIS: redis://redis.databases:6379
        PAPERLESS_TIME_ZONE: '{{ .Values.tz }}'
        PAPERLESS_OCR_LANGUAGE: eng
        PAPERLESS_TIKA_ENABLED: "1"
        PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
        PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
        PAPERLESS_CONSUMER_RECURSIVE: "true"
volumeMounts:
    - mountPath: /usr/src/paperless/data
      name: paperless
      subPath: data
    - mountPath: /usr/src/paperless/media
      name: paperless
      subPath: media
    - mountPath: /usr/src/paperless/export
      name: paperless
      subPath: export
    - mountPath: /usr/src/paperless/consume
      name: paperless
      subPath: consume
volumes:
    - name: paperless
      mountPvc: "yes"
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
ingress:
    enabled: true
    authelia: true
    className: nginx
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: paperless.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: ImplementationSpecific
affinity:
    podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                namespaceSelector: {}
                labelSelector:
                    matchExpressions:
                        - key: app.kubernetes.io/instance
                          operator: In
                          values:
                            - postgres
                topologyKey: kubernetes.io/hostname
resources:
    limits:
        cpu: 1000m
        memory: 1Gi
    requests:
        cpu: 100m
        memory: 512Mi
livenessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        port: 8000
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /
        port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
