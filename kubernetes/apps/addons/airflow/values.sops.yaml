configmap:
    mountEnv: true
    data:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__PARALLELISM: "8"
        AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
        AIRFLOW_VAR_KPO_IMAGE: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
        AIRFLOW__CORE__AUTH_MANAGER: airflow_oidc.OIDCAuthManager
        AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
        AIRFLOW__FAB__CONFIG_FILE: /opt/airflow/webserver_config.py
        AIRFLOW__FAB__ENABLE_PROXY_FIX: "true"
        AIRFLOW__FAB__PROXY_FIX_X_FOR: "0"
        AIRFLOW__FAB__PROXY_FIX_X_PROTO: "1"
        AIRFLOW__FAB__PROXY_FIX_X_HOST: "0"
        AIRFLOW__FAB__PROXY_FIX_X_PORT: "0"
        AIRFLOW__FAB__PROXY_FIX_X_PREFIX: "0"
pvc:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
volumeMounts:
    - name: data
      mountPath: /data
    - name: secrets
      mountPath: /var/run/secrets/airflow
      readOnly: true
volumes:
    - name: data
      mountPvc: true
    - name: secrets
      secret:
        secretName: airflow-secrets-backend
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: airflow.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-addons-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 60s
resources:
    requests:
        cpu: 500m
        memory: 1Gi
    limits:
        cpu: "2"
        memory: 4Gi
livenessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
args:
    - bash
    - /opt/airflow/start.sh
