  - name: airflow-secrets-backend
    stringData:
      variables.yaml: ENC[AES256_GCM,data:,iv:Mb9Bp/gZvUAicSmFuTSFGmfcSRSikZANfxKCq6EpAUU=,tag:CKR+BVJa5ONYR/0ogwSY5A==,type:str]
