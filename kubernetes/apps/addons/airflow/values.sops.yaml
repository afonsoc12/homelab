# --------------------
# Apache Airflow
#   - Repo:           https://github.com/apache/airflow
#   - Docs:           https://airflow.apache.org/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
image:
    repository: ghcr.io/afonsoc12/airflow
    tag: 3.4.0-b71
    pullPolicy: Always
serviceAccount:
    create: true
rbac:
    rules:
        - apiGroups:
            - ""
          resources:
            - pods
            - pods/log
            - pods/status
          verbs:
            - get
            - list
            - watch
            - create
            - delete
            - patch
        - apiGroups:
            - ""
          resources:
            - pods/exec
          verbs:
            - create
            - get
        - apiGroups:
            - ""
          resources:
            - events
          verbs:
            - list
podSecurityContext:
    fsGroup: 50000
    fsGroupChangePolicy: OnRootMismatch
securityContext:
    runAsUser: 50000
    runAsGroup: 0
ports:
    - containerPort: 8080
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
    type: ClusterIP
    port: 8080
secret:
    mountEnv: true
    stringData:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ENC[AES256_GCM,data:pETSN4Z97yTsY3Osct3Yb3TMKww2x/xj92nkBDr3HDHPr/pHOSp/BZFANxf47L5bMwgat/MglJQBuxOv/r3FRgya/nem55Qkl4MS3OrU2Aul34osf1U=,iv:zuHbvJyhj2sX9NCCWi3c/YMpLhbrnEKj1JkZ50vSDnM=,tag:5TmFQh+laqQrq/rIEtPgkg==,type:str]
