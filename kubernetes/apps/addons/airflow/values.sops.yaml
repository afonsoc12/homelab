    - name: airflow-secrets-backend
      stringData:
        variables.yaml: ENC[AES256_GCM,data:,iv:0W/3YSaD2gfrzqz4o3fm5ZvMEswBM6XnYjiTm8rRtgo=,tag:Gy92vEzH6qpRdLc++UuMRw==,type:str]
        connections.yaml: ENC[AES256_GCM,data:YWdlA+FamBaFlwsDLBvw2yaq7sLMx46KZyzyaidBHL+QOAqI9uWj4nSn4rlZpnKNZxZhHw/xsytLBQ+vfKP3zBjcVaWDTKRc3CVlowfzeyCkcrXd3fWGwdQ1CsIf9zVj4z4uYVY9FcieoOZXm061QRnHnuYl+SFpwOGSTDrIbf125d2P77Qzc8XuJDNdZyhLAMrS9X5aL1YzYTPx,iv:Sr8mMdCoQukqDCJnC26eVur8c47mQwHn7i4GHt9UHMU=,tag:expo3zq7YOyQtTbfxfztMw==,type:str]
configmap:
    mountEnv: true
    data:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW_VAR_KPO_IMAGE: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
pvc:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
volumeMounts:
    - name: data
      mountPath: /data
    - name: secrets
      mountPath: /var/run/secrets/airflow
      readOnly: true
volumes:
    - name: data
      mountPvc: true
    - name: secrets
      secret:
        secretName: airflow-secrets-backend
ingress:
    enabled: true
    authelia: true
    className: nginx
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: airflow.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: ImplementationSpecific
resources:
    requests:
        cpu: 500m
        memory: 1Gi
    limits:
        cpu: "2"
        memory: 8Gi
livenessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
