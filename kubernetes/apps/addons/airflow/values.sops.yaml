configmap:
    mountEnv: true
    data:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__PARALLELISM: "8"
        AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
        AIRFLOW_VAR_KPO_IMAGE: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
pvc:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
volumeMounts:
    - name: data
      mountPath: /data
    - name: secrets
      mountPath: /var/run/secrets/airflow
      readOnly: true
volumes:
    - name: data
      mountPvc: true
    - name: secrets
      secret:
        secretName: airflow-secrets-backend
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: airflow.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-addons-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 60s
resources:
    requests:
        cpu: 500m
        memory: 1Gi
    limits:
        cpu: "2"
        memory: 4Gi
livenessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    httpGet:
        path: /api/v2/monitor/health
        port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
