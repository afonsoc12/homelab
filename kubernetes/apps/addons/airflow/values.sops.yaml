# --------------------
# Apache Airflow
#   - Repo:           https://github.com/apache/airflow
#   - Docs:           https://airflow.apache.org/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
image:
  repository: ghcr.io/afonsoc12/airflow
  tag: 3.3.2-b59
  pullPolicy: Always
serviceAccount:
  create: true
rbac:
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
        - pods/status
      verbs:
        - get
        - list
        - watch
        - create
        - delete
        - patch
    - apiGroups:
        - ""
      resources:
        - pods/exec
      verbs:
        - create
        - get
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - list
podSecurityContext:
  fsGroup: 50000
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 50000
  runAsGroup: 0
ports:
  - containerPort: 8080
    name: http
    protocol: TCP
    service: true
service:
  enabled: true
  type: ClusterIP
  port: 8080
