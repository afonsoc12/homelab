# --------------------
# Apache Airflow
#   - Repo:           https://github.com/apache/airflow
#   - Docs:           https://airflow.apache.org/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
image:
    repository: ghcr.io/afonsoc12/airflow
    tag: 3.2.1-b38
    pullPolicy: Always
serviceAccount:
    create: true
rbac:
    rules:
        - apiGroups:
            - ""
          resources:
            - pods
            - pods/log
            - pods/status
          verbs:
            - get
            - list
            - watch
            - create
            - delete
        - apiGroups:
            - ""
          resources:
            - events
          verbs:
            - list
podSecurityContext:
    fsGroup: 50000
    fsGroupChangePolicy: OnRootMismatch
securityContext:
    runAsUser: 50000
    runAsGroup: 0
ports:
    - containerPort: 8080
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
    type: ClusterIP
    port: 8080
secret:
    mountEnv: true
    stringData:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ENC[AES256_GCM,data:PTces57WiJmAbynMRZJrcWzvpdSE43wGZrT/V1Jl/6up+hXyBrazyF/iFT3392iV3BGmj1TFHDGGcxhUyeC/rgyB5q+LXA2Kdue2Lqaue+xKOHp2k+E=,iv:jnlj1FDVbSNkxM1kGFsinXBHabvmQ9F6pNlFPsv8p/s=,tag:mL0lSr0XoRNhrEkBKsqjcg==,type:str]
