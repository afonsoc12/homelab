      stringData:
        variables.yaml: ENC[AES256_GCM,data:,iv:X8oNWhbFW565IaoaAr4Ff9o9RLqZGMEH4k7IcMnCUEc=,tag:8Nh6ljs2Vpsoyme+zSgE3A==,type:str]
