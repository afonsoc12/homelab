    stringData:
      variables.yaml: ENC[AES256_GCM,data:,iv:aWV+AuLhj7Yy0WxoAZSaB63g4wK1HxyvKEj1QWWCjxA=,tag:dokP7SjVarn0nwHK4Zua2A==,type:str]
