    - name: airflow-secrets-backend
      stringData:
        variables.yaml: ENC[AES256_GCM,data:,iv:2PxD4rP/dBGaGgmbhn+oMDZCprQejyts9EN8rUAlzmE=,tag:56hvAHQCSugUH7XeOB1Zlw==,type:str]
