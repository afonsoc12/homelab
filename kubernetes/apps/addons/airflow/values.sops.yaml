extraSecrets:
  - name: airflow-secrets-backend
    stringData:
      variables.yaml: ENC[AES256_GCM,data:,iv:Mb9Bp/gZvUAicSmFuTSFGmfcSRSikZANfxKCq6EpAUU=,tag:CKR+BVJa5ONYR/0ogwSY5A==,type:str]
      connections.yaml: ENC[AES256_GCM,data:FC0ey/ij/dKaj7cuideF53jsd0E/7QLeI5NXG1SPYQUlL69yybTqV+X4tSwogHiynQVKuWHUgGv7ae8TzbwZfFz5ME7OvZXei7TBxJSh2aC9rcCVqVw2fAIiUlC4T9IeJv3f3hcGYBPDuexwfsdFo/rb0/MHbB+kErJbDA9sm7TEYCg15QK7kE0I4vN3i8IFLaHvxFKQ8BPZtJ+0,iv:icyrk0UiG/sGhfrV98MOfwhv3MJiQvP4/LypvVGq3zQ=,tag:O7t2OatG4XP55SUh6no97Q==,type:str]
configmap:
  mountEnv: true
  data:
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__FAB__CONFIG_FILE: "/opt/airflow/webserver_config.py"
    AIRFLOW__FAB__ENABLE_PROXY_FIX: "True"
    AIRFLOW__API__BASE_URL: "https://airflow.local.{{ .Values.domain }}"
    OIDC_DISCOVERY_URL: "https://sso.{{ .Values.domain }}/application/o/airflow/.well-known/openid-configuration"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
    AIRFLOW_VAR_KPO_IMAGE: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
pvc:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
volumeMounts:
  - name: data
    mountPath: /data
  - name: secrets
    mountPath: /var/run/secrets/airflow
    readOnly: true
volumes:
  - name: data
    mountPvc: true
  - name: secrets
    secret:
      secretName: airflow-secrets-backend
ingress:
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
  enabled: true
  authelia: false
  className: contour
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: airflow.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
livenessProbe:
  httpGet:
    path: /api/v2/monitor/health
    port: 8080
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /api/v2/monitor/health
    port: 8080
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /api/v2/monitor/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 5
