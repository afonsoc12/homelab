# --------------------
# MetalLB
#   - Repo:           https://github.com/metallb/metallb
#   - Docs:           https://metallb.universe.tf/
#   - Chart Defaults: https://github.com/metallb/metallb/blob/main/charts/metallb/values.yaml
# --------------------
---
# Default values for metallb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# controller contains configuration specific to the MetalLB cluster
# controller.
controller:
  enabled: true
  # -- Controller log level. Must be one of: `all`, `debug`, `info`, `warn`, `error` or `none`
  logLevel: info
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 256Mi
# speaker contains configuration specific to the MetalLB speaker
# daemonset.
speaker:
  enabled: true
  # command: /speaker
  # -- Speaker log level. Must be one of: `all`, `debug`, `info`, `warn`, `error` or `none`
  logLevel: info
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi
crds:
  enabled: true
  validationFailurePolicy: Fail
# Values passed to the frr-k8s subchart (note the hyphen in "frr-k8s").
frr-k8s:
  frrk8s:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi
  frr:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi
  reloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
  frrMetrics:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 64Mi
  frrStatus:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 48Mi
