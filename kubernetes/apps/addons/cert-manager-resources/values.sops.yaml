# --------------------
# cert-manager Resources
#   - Repo:           https://github.com/afonsoc12/homelab
#   - Docs:           https://cert-manager.io/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/cert-manager-resources/values.yaml
# --------------------
issuers:
    - name: letsencrypt
      server: https://acme-v02.api.letsencrypt.org/directory
      # Name of a secret used to store the ACME account private key
      apiTokenSecretRef:
        name: cloudflare-api
        key: API_TOKEN
    - name: letsencrypt-stg
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      # Name of a secret used to store the ACME account private key
      apiTokenSecretRef:
        name: cloudflare-api
        key: API_TOKEN
secrets:
    - name: cloudflare-api
      stringData:
        API_TOKEN: ENC[AES256_GCM,data:ekm3kTZpYZvTlX4tX62wqMzp5tnx3dwEKhIRmmG0HYBhbVL/Z1LZSA==,iv:JoNvHvWvVQogV3seMicISUCp3g0EdrAD9uqX8ebL3Yc=,tag:0IrTjvTraTegjW/BXtzlhg==,type:str]
certificates:
    - name: auth
      dnsNames:
        - auth.{{ .Values.domain }}
      reflectNamespaces:
        - ingress
    - name: calibre
      dnsNames:
        - calibre.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: firefly
      dnsNames:
        - firefly.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: home
      dnsNames:
        - home.{{ .Values.domain }}
      reflectNamespaces:
        - automation
        - sandbox
    - name: music-assistant-alexa-skill
      dnsNames:
        - music-assistant-alexa-skill.{{ .Values.domain }}
      reflectNamespaces:
        - automation
        - sandbox
    - name: music-assistant-stream
      dnsNames:
        - music-assistant-stream.{{ .Values.domain }}
      reflectNamespaces:
        - automation
    - name: local-wildcard
      dnsNames:
        - local.{{ .Values.domain }}
        - '*.local.{{ .Values.domain }}'
      reflectNamespaces:
        - addons
        - automation
        - databases
        - devops
        - homelab
        - ingress
        - longhorn-system
        - monitoring
        - sandbox
        - wordpress
    - name: seerr
      dnsNames:
        - seerr.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: plex
      dnsNames:
        - plex.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - ingress
        - sandbox
    - name: rss
      dnsNames:
        - rss.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: srv-wildcard
      dnsNames:
        - '*.srv.{{ .Values.domain }}'
      reflectNamespaces:
        - homelab
        - sandbox
    - name: stocks
      dnsNames:
        - stocks.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: wallabag
      dnsNames:
        - wallabag.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
    - name: status
      dnsNames:
        - status.{{ .Values.domain }}
      reflectNamespaces:
        - monitoring
    - name: sso
      dnsNames:
        - sso.{{ .Values.domain }}
      reflectNamespaces:
        - sandbox
        - ingress
    - name: spliit
      dnsNames:
        - split.{{ .Values.domain }}
      reflectNamespaces:
        - homelab
        - sandbox
