## Application controller
controller:
    # -- Application controller name string
    name: application-controller
    # -- The number of application controller pods to run.
    # Additional replicas will cause sharding of managed clusters across number of replicas.
    replicas: 1
    # -- Resource limits and requests for the application controller pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
## Dex
dex:
    # -- Enable dex
    enabled: false
    # -- Dex name
    name: dex-server
## Redis
redis:
    # -- Enable redis
    enabled: true
    # -- Redis name
    name: redis
    # External Redis parameters
    # externalRedis:
    #   # -- External Redis server host
    # host: "redis.databases"
    #   # -- External Redis username
    #   username: ""
    #   # -- External Redis password
    #   password: ""
    #   # -- External Redis server port
    # port: 6379
    #   # -- The name of an existing secret with Redis credentials (must contain key `redis-password`).
    #   # When it's set, the `externalRedis.password` parameter is ignored
    #   existingSecret: ""
    #   # -- External Redis Secret annotations
    #   secretAnnotations: {}
    # -- Resource limits and requests for redis
    resources:
        requests:
            cpu: 10m
            memory: 32Mi
        limits:
            cpu: 200m
            memory: 256Mi
    readinessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    livenessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
## Server
server:
    # -- Argo CD server name
    name: server
    # -- The number of server pods to run
    replicas: 1
    # -- Resource limits and requests for the server pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    ingress:
        enabled: true
        annotations:
            ingress.kubernetes.io/force-ssl-redirect: "true"
            projectcontour.io/websocket-routes: /
            projectcontour.io/response-timeout: 300s
        ingressClassName: contour
        path: /
        pathType: Prefix
        tls: false
        extraTls:
            - secretName: local-wildcard-cert
              hosts:
                - '{{ .Values.global.domain }}'
    service:
        annotations:
            projectcontour.io/upstream-protocol.tls: "443"
## Repo Server
repoServer:
    # -- Repo server name
    name: repo-server
    # -- The number of repo server pods to run
    replicas: 1
    livenessProbe:
        timeoutSeconds: 10
        initialDelaySeconds: 30
    readinessProbe:
        timeoutSeconds: 10
    # -- Resource limits and requests for the repo server pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
    # -- Environment variables to pass to repo server
    env:
        # Ensures ArgoCD invokes the helm-secrets wrapper script (which decrypts
        # secrets:// values before delegating to HELM_SECRETS_HELM_PATH) instead
        # of resolving the image's embedded helm binary directly. Without this,
        # Helm v4's plugin loader doesn't register "secrets" as a subcommand and
        # any app referencing a secrets:// values file fails to render.
        # https://github.com/jkroepke/helm-secrets/wiki/ArgoCD-Integration
        #
        # Note: Kubernetes' $(VAR) env substitution only resolves references to
        # OTHER vars already defined in this same container's env list — it can't
        # self-reference the image's built-in PATH (set via the image's Dockerfile
        # ENV, not this list). A $(PATH) self-reference here is emitted literally,
        # wiping out /usr/bin etc. and crashing every exec (e.g. gpg) that isn't
        # under /gitops-tools. Hardcode the base image's real PATH instead.
        - name: PATH
          value: /gitops-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: HELM_PLUGINS
          value: /gitops-tools/helm-plugins/
        - name: HELM_SECRETS_CURL_PATH
          value: /gitops-tools/curl
        - name: HELM_SECRETS_SOPS_PATH
          value: /gitops-tools/sops
        - name: HELM_SECRETS_VALS_PATH
          value: /gitops-tools/vals
        - name: HELM_SECRETS_KUBECTL_PATH
          value: /gitops-tools/kubectl
        - name: HELM_SECRETS_BACKEND
          value: sops
        # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
        - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
          value: "false"
        # Argo CD resolves values files to absolute paths; required by its wrapper.
        - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
          value: "true"
        # Local charts load encrypted values from ../../apps within this repository.
        - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
          value: "true"
        - name: HELM_SECRETS_WRAPPER_ENABLED
          value: "true"
        - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
          value: "true"
        # helm-secrets' plugin.yaml still uses the legacy (pre-apiVersion) manifest
        # format, which Helm v4's plugin loader doesn't register as a subcommand.
        # Helm v3 loads it fine, so the wrapper delegates the actual "helm secrets"
        # invocation to a pinned v3 binary downloaded by the download-tools
        # initContainer, instead of the image's embedded Helm v4 binary.
        - name: HELM_SECRETS_HELM_PATH
          value: /gitops-tools/helm3
        - name: HELM_SECRETS_LOAD_GPG_KEYS
          # Multiple keys can be separated by space
          value: /homelab-sops-gpg/sops.asc
    # -- Init containers to add to the repo server pods
    initContainers:
        - name: download-tools
          image: docker.io/alpine:3.24.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          env:
            - name: HELM_SECRETS_VERSION
              value: 4.7.10
            - name: HELM3_VERSION
              value: 3.22.1
            - name: KUBECTL_VERSION
              value: 1.37.2
            - name: VALS_VERSION
              value: 0.51.0
            - name: SOPS_VERSION
              value: 3.13.3
          args:
            - |
              sleep 2

              mkdir -p /gitops-tools/helm-plugins

              GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/')
              wget -qO /gitops-tools/curl https://github.com/moparisthebest/static-curl/releases/download/v8.11.0/curl-${GO_ARCH}

              GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/') && \
              wget -qO /gitops-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl
              wget -qO /gitops-tools/sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}
              wget -qO- https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz | tar zxv -C /gitops-tools vals
              wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -C /gitops-tools/helm-plugins -xzf-
              wget -qO- https://get.helm.sh/helm-v${HELM3_VERSION}-linux-${GO_ARCH}.tar.gz | tar -C /gitops-tools --strip-components=1 -xzf- linux-${GO_ARCH}/helm
              mv /gitops-tools/helm /gitops-tools/helm3

              chmod +x /gitops-tools/*
              cp /gitops-tools/helm-plugins/helm-secrets/scripts/wrapper/helm.sh /gitops-tools/helm
          volumeMounts:
            - mountPath: /gitops-tools
              name: gitops-tools
    # -- Additional volumeMounts to the repo server main container
    volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools
        - mountPath: /usr/local/sbin/helm
          subPath: helm
          name: gitops-tools
        - mountPath: /homelab-sops-gpg/
          name: homelab-sops-gpg
          readOnly: true
    # -- Additional volumes to the repo server pod
    volumes:
        - name: gitops-tools
          emptyDir: {}
        - name: homelab-sops-gpg
          secret:
            secretName: ENC[AES256_GCM,data:Dp+YOKfaudsXqySBOHb4GQ==,iv:wC9fMMhW6SVPSaKFXf5Ocv6Yt/CiGwuEQT/jAdlwMPw=,tag:NnnVOlVLh56Aq12ySgwwhQ==,type:str]
## ApplicationSet controller
applicationSet:
    # -- Enable ApplicationSet controller
    enabled: true
    # -- ApplicationSet controller name string
    name: applicationset-controller
    # -- Resource limits and requests for the application set controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    readinessProbe:
        enabled: true
    livenessProbe:
        enabled: true
    startupProbe:
        enabled: true
## Notifications controller
notifications:
    # -- Enable notifications controller
    enabled: true
    # -- Notifications controller name string
    name: notifications-controller
    # -- Resource limits and requests for the notifications controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    argocdUrl: ENC[AES256_GCM,data:QD3zXQWy/CHDnDLmZ3IyPprIOg06jEIGTfLJ9xyRwkCnZg==,iv:pcHNnu2oN+zMLmIK9qLaCSet+2GSqD/siBsXEuc47rU=,tag:pF0ziGvOfA5k7uu/e2/ANw==,type:str]
    secret:
        items:
            discord-webhook: ENC[AES256_GCM,data:wLmmJTV/cqAkEcFilMvJaqjbEik7FQpV8LcAY/Z+sIVPgBkqcpQnZ7ILYOjNAUR7e5+qZFDWjO3j4byKgYvRaCtxrZ6ue03mO0RRbSBq0eADOWobvGbHpOygVeXN+5PPjJiIBqgM++JJt0TMDCsVneiBf5YwO7+xfQ==,iv:3f04sX6xkSBbbwztam0pEQpoMVZTgb4hkK16NdF83B8=,tag:6fjqqgJuu9dRnPHrVwkHgQ==,type:str]
    notifiers:
        service.webhook.discord: |
            url: $discord-webhook
            headers:
              - name: Content-Type
                value: application/json
    templates:
        # Message layout mirrors the Prometheus Alertmanager Discord notifier
        # (kubernetes/apps/monitoring/prometheus-stack): status emoji + event
        # name title, quote-block body with a bold summary line, cluster/
        # namespace/timestamp context line, then markdown links.
        template.app-deployed: "webhook:\n  discord:\n    method: POST\n    body: |\n      {\n        \"embeds\": [{\n          \"title\": \"\U0001F7E2 AppDeployed · `{{.app.spec.destination.name}}`\",\n          \"color\": 3066993,\n          \"description\": \"> **{{.app.metadata.name}} synced successfully**\\n> {{(call .repo.GetCommitMetadata .app.status.sync.revision).Message | trunc 100}}\\n> \U0001F4E6 `{{.app.spec.destination.namespace}}` · \U0001F552 {{.app.status.operationState.finishedAt}}\\n> [\U0001F50D App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}}) · [\U0001F4DD {{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}}) by {{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}\"\n        }]\n      }\n"
        template.app-health-degraded: "webhook:\n  discord:\n    method: POST\n    body: |\n      {\n        \"embeds\": [{\n          \"title\": \"\U0001F534 AppHealthDegraded · `{{.app.spec.destination.name}}`\",\n          \"color\": 15158332,\n          \"description\": \"> **{{.app.metadata.name}} health degraded**\\n> Health status: `{{.app.status.health.status}}`\\n> \U0001F4E6 `{{.app.spec.destination.namespace}}` · \U0001F552 {{.app.status.reconciledAt}}\\n> [\U0001F50D App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})\"\n        }]\n      }\n"
        template.app-sync-failed: "webhook:\n  discord:\n    method: POST\n    body: |\n      {\n        \"embeds\": [{\n          \"title\": \"\U0001F534 AppSyncFailed · `{{.app.spec.destination.name}}`\",\n          \"color\": 15158332,\n          \"description\": \"> **{{.app.metadata.name}} sync failed**\\n> {{.app.status.operationState.message | default \\\"No error message\\\"}}\\n> \U0001F4E6 `{{.app.spec.destination.namespace}}` · \U0001F552 {{.app.status.operationState.finishedAt}}\\n> [\U0001F50D App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}}) · [\U0001F4DD {{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}}) by {{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}\"\n        }]\n      }\n"
        template.app-sync-status-unknown: "webhook:\n  discord:\n    method: POST\n    body: |\n      {\n        \"embeds\": [{\n          \"title\": \"\U0001F7E1 AppSyncStatusUnknown · `{{.app.spec.destination.name}}`\",\n          \"color\": 15105570,\n          \"description\": \"> **{{.app.metadata.name}} sync status unknown**\\n> ArgoCD could not determine whether the live state matches Git — check for CRD issues or repo access errors.\\n> \U0001F4E6 `{{.app.spec.destination.namespace}}` · \U0001F552 {{.app.status.reconciledAt}}\\n> [\U0001F50D App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})\"\n        }]\n      }\n"
    triggers:
        trigger.on-deployed: |
            - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
              oncePer: app.status.sync.revision
              send: [app-deployed]
        trigger.on-health-degraded: |
            - when: app.status.health.status in ['Degraded', 'Missing', 'Unknown']
              oncePer: app.status.reconciledAt
              send: [app-health-degraded]
        trigger.on-sync-failed: |
            - when: app.status.operationState.phase in ['Error', 'Failed']
              oncePer: app.status.sync.revision
              send: [app-sync-failed]
        trigger.on-sync-status-unknown: |
            - when: app.status.sync.status == 'Unknown'
              oncePer: app.status.reconciledAt
              send: [app-sync-status-unknown]
    subscriptions:
        - recipients:
            - discord
          triggers:
            - on-deployed
            - on-health-degraded
            - on-sync-failed
            - on-sync-status-unknown
    readinessProbe:
        enabled: true
    livenessProbe:
        enabled: true
    startupProbe:
        enabled: true
sops:
    encrypted_regex: ^(data|stringData|secret|domain|argocdUrl|oidc\.config|loadBalancerIP|policy\.csv)$
