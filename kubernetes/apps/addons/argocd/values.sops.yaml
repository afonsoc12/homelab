# --------------------
# ArgoCD
#   - Repo:           https://github.com/argoproj/argo-cd
#   - Docs:           https://argo-cd.readthedocs.io/
#   - Chart Defaults: https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# --------------------
## Argo CD configuration
## Ref: https://github.com/argoproj/argo-cd
##
# -- Provide a name in place of `argocd`
nameOverride: argocd
## Custom resource configuration
crds:
    # -- Install and upgrade CRDs
    install: true
    # -- Keep CRDs on chart uninstall
    keep: true
## Globally shared configuration
global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: ENC[AES256_GCM,data:kBxftVuVqJLy5+7Esmop2RT66UKf2hx62HI=,iv:z0tr7Y33fRV1824P+yoRtOUl5Nye/kj27lg1wS+LftU=,tag:UD86IPiCXlngOg6ygsfUbQ==,type:str]
    # -- Common labels for the all resources
    additionalLabels: {}
    # app: argo-cd
    # -- Number of old deployment ReplicaSets to retain. The rest will be garbage collected.
    revisionHistoryLimit: 3
    # Default logging options used by all components
    logging:
        # -- Set the global logging format. Either: `text` or `json`
        format: text
        # -- Set the global logging level. One of: `debug`, `info`, `warn` or `error`
        level: info
## Argo Configs
configs:
    # General Argo CD configuration
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cm.yaml
    cm:
        # -- Create the argocd-cm configmap for [declarative setup]
        create: true
        helm.valuesFileSchemes: secrets+gpg-import, secrets+gpg-import-kubernetes, secrets+age-import, secrets+age-import-kubernetes, secrets,secrets+literal, https
        admin.enabled: "false"
        oidc.config: ENC[AES256_GCM,data:,iv:KJkJTg7aM5CAKrRRI1++mL8EO0QRax2k9pgK2tmc5Yo=,tag:jHyYoTdXapYz84uqDToJzQ==,type:str]
        oidc.tls.insecure.skip.verify: "true"
        # Ignore metallb service changes
        resource.customizations.ignoreDifferences.Service: |
            jqPathExpressions:
            - '.spec.clusterIP'
        resource.exclusions: |
            ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
            - apiGroups:
              - ''
              - discovery.k8s.io
              kinds:
              - Endpoints
            #  - EndpointSlice
            ### Internal Kubernetes resources excluded reduce the number of watched events
            - apiGroups:
              - coordination.k8s.io
              kinds:
              - Lease
            ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
            - apiGroups:
              - authentication.k8s.io
              - authorization.k8s.io
              kinds:
              - SelfSubjectReview
              - TokenReview
              - LocalSubjectAccessReview
              - SelfSubjectAccessReview
              - SelfSubjectRulesReview
              - SubjectAccessReview
            ### Intermediate Certificate Request excluded reduce the number of watched events
            - apiGroups:
              - certificates.k8s.io
              kinds:
              - CertificateSigningRequest
            - apiGroups:
              - cert-manager.io
              kinds:
              - CertificateRequest
            ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
            - apiGroups:
              - cilium.io
              kinds:
              - CiliumIdentity
              - CiliumEndpoint
              - CiliumEndpointSlice
            ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
            - apiGroups:
              - kyverno.io
              - reports.kyverno.io
              - wgpolicyk8s.io
              kinds:
              - PolicyReport
              - ClusterPolicyReport
              - EphemeralReport
              - ClusterEphemeralReport
              - AdmissionReport
              - ClusterAdmissionReport
              - BackgroundScanReport
              - ClusterBackgroundScanReport
              - UpdateRequest
    # Argo CD configuration parameters
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cmd-params-cm.yaml
    params:
        # -- Create the argocd-cmd-params-cm configmap
        # If false, it is expected the configmap will be created by something else.
        create: true
        ## Server properties
        # -- Run server without TLS
        ## NOTE: This value should be set when you generate params by other means as it changes ports used by ingress template.
        server.insecure: false
        # -- Bound concurrent manifest generations to cap repo-server memory
        reposerver.parallelism.limit: "4"
        # -- Value for base href in index.html. Used if Argo CD is running behind reverse proxy under subpath different from /
        # server.basehref: /argocd
        # -- Used if Argo CD is running behind reverse proxy under subpath different from /
        # server.rootpath: /argocd
    # ConfigMap for Config Management Plugins
    # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
    cmp:
        # -- Create the argocd-cmp-cm configmap
        create: true
        # -- Annotations to be added to argocd-cmp-cm configmap
        annotations: {}
        # -- Plugin yaml files to be added to argocd-cmp-cm
        plugins: {}
        # https://community.ops.io/jilgue/secrets-in-argocd-with-sops-pa6
        # sops:
        #   init:
        #     command: ["/bin/sh", "-c"]
        #     args: ["if [ -f 'values.sops.yaml' ]; then echo '---' > values.yaml && sops -d --input-type yaml --output-type yaml values.sops.yaml >> values.yaml; fi"]
        #   generate:
        #     command: ["/bin/sh", "-c"]
        #     args: ["cat *.yaml | yq"]
    secret:
        createSecret: ENC[AES256_GCM,data:IwMvWQ==,iv:UYdQr0MECB7FEg9v+5iDIQjSca4osrXEnkOOvSf88ek=,tag:sBjyXYDcX9EOy6fSH8WFHQ==,type:bool]
        oidc.authentik.clientId: ENC[AES256_GCM,data:V1XJtBqOuPYanGjw6iClmIEnr3lUzCezil5URC+x2l8pZGeCGukWRQ==,iv:sI9h6Ig+y9QL9ocgJjd0T5a0s2eyFcvdiA/ZNcsjKvE=,tag:GAZG40QhV8kCw47d79eVUw==,type:str]
        oidc.authentik.secret: ENC[AES256_GCM,data:6q5Q4iehh9KD/2ol+MVnCCD5t5dj91h8RGr6y0eFfk8MW4PtgNjTzABNUgMZJ+3W9SHmf1iPy3eSn004LVvGvKhdQe559I8qxlrX1WxGUHqaooCLbVUQWcBBfVLHp0AkM9elmZ9/vYcWe/VUExQxuxfuXdKf+b7UW+pSRZGEM6Q=,iv:H3wlvLVkGckTf3DUBIFl5mhaNU3506m7twaF6ZMZ1Hg=,tag:qDEqkwyrhDrdRaIoUw+ikg==,type:str]
    rbac:
        # -- Create the argocd-rbac-cm configmap with ([Argo CD RBAC policy]) definitions.
        # If false, it is expected the configmap will be created by something else.
        # Argo CD will not work if there is no configmap created with the name above.
        create: true
        policy.csv: |
            g, authentik_admins, role:admin
# -- Array of extra K8s manifests to deploy
## Note: Supports use of custom Helm templates
extraObjects: []
# - apiVersion: secrets-store.csi.x-k8s.io/v1
#   kind: SecretProviderClass
#   metadata:
#     name: argocd-secrets-store
#   spec:
#     provider: aws
#     parameters:
#       objects: |
#         - objectName: "argocd"
#           objectType: "secretsmanager"
#           jmesPath:
#               - path: "client_id"
#                 objectAlias: "client_id"
#               - path: "client_secret"
#                 objectAlias: "client_secret"
#     secretObjects:
#     - data:
#       - key: client_id
#         objectName: client_id
#       - key: client_secret
#         objectName: client_secret
#       secretName: argocd-secrets-store
#       type: Opaque
