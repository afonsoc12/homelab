# --------------------
# ArgoCD
#   - Repo:           https://github.com/argoproj/argo-cd
#   - Docs:           https://argo-cd.readthedocs.io/
#   - Chart Defaults: https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# --------------------
## Argo CD configuration
## Ref: https://github.com/argoproj/argo-cd
##
# -- Provide a name in place of `argocd`
nameOverride: argocd
## Custom resource configuration
crds:
    # -- Install and upgrade CRDs
    install: true
    # -- Keep CRDs on chart uninstall
    keep: true
## Globally shared configuration
global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: ENC[AES256_GCM,data:pbuQ7mygL38dSlQticUfm/Sw/v+ZdMoPNX8=,iv:AI96H+Rpr0rRZh6nMtJglZdhqS7E9SNFeBF1NEIVkaE=,tag:yBe8fU9t+Etshdo7BPc2mg==,type:str]
    # -- Common labels for the all resources
    additionalLabels: {}
    # app: argo-cd
    # -- Number of old deployment ReplicaSets to retain. The rest will be garbage collected.
    revisionHistoryLimit: 3
    # Default logging options used by all components
    logging:
        # -- Set the global logging format. Either: `text` or `json`
        format: text
        # -- Set the global logging level. One of: `debug`, `info`, `warn` or `error`
        level: info
## Argo Configs
configs:
    # General Argo CD configuration
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cm.yaml
    cm:
        # -- Create the argocd-cm configmap for [declarative setup]
        create: true
        helm.valuesFileSchemes: secrets+gpg-import, secrets+gpg-import-kubernetes, secrets+age-import, secrets+age-import-kubernetes, secrets,secrets+literal, https
        admin.enabled: "false"
        oidc.config: ENC[AES256_GCM,data:,iv:e4j9AW5TPGhf3pojLliBi2aOokKpSEyZSWMJG3Tdyag=,tag:xui4PgKlK7me3vZhIpINPw==,type:str]
        oidc.tls.insecure.skip.verify: "true"
        # Ignore metallb service changes
        resource.customizations.ignoreDifferences.Service: |
            jqPathExpressions:
            - '.spec.clusterIP'
        resource.exclusions: |
            ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
            - apiGroups:
              - ''
              - discovery.k8s.io
              kinds:
              - Endpoints
            #  - EndpointSlice
            ### Internal Kubernetes resources excluded reduce the number of watched events
            - apiGroups:
              - coordination.k8s.io
              kinds:
              - Lease
            ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
            - apiGroups:
              - authentication.k8s.io
              - authorization.k8s.io
              kinds:
              - SelfSubjectReview
              - TokenReview
              - LocalSubjectAccessReview
              - SelfSubjectAccessReview
              - SelfSubjectRulesReview
              - SubjectAccessReview
            ### Intermediate Certificate Request excluded reduce the number of watched events
            - apiGroups:
              - certificates.k8s.io
              kinds:
              - CertificateSigningRequest
            - apiGroups:
              - cert-manager.io
              kinds:
              - CertificateRequest
            ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
            - apiGroups:
              - cilium.io
              kinds:
              - CiliumIdentity
              - CiliumEndpoint
              - CiliumEndpointSlice
            ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
            - apiGroups:
              - kyverno.io
              - reports.kyverno.io
              - wgpolicyk8s.io
              kinds:
              - PolicyReport
              - ClusterPolicyReport
              - EphemeralReport
              - ClusterEphemeralReport
              - AdmissionReport
              - ClusterAdmissionReport
              - BackgroundScanReport
              - ClusterBackgroundScanReport
              - UpdateRequest
    # Argo CD configuration parameters
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cmd-params-cm.yaml
    params:
        # -- Create the argocd-cmd-params-cm configmap
        # If false, it is expected the configmap will be created by something else.
        create: true
        ## Server properties
        # -- Run server without TLS
        ## NOTE: This value should be set when you generate params by other means as it changes ports used by ingress template.
        server.insecure: false
        # -- Bound concurrent manifest generations to cap repo-server memory
        reposerver.parallelism.limit: "4"
        # -- Value for base href in index.html. Used if Argo CD is running behind reverse proxy under subpath different from /
        # server.basehref: /argocd
        # -- Used if Argo CD is running behind reverse proxy under subpath different from /
        # server.rootpath: /argocd
    # ConfigMap for Config Management Plugins
    # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
    cmp:
        # -- Create the argocd-cmp-cm configmap
        create: true
        # -- Annotations to be added to argocd-cmp-cm configmap
        annotations: {}
        # -- Plugin yaml files to be added to argocd-cmp-cm
        plugins: {}
        # https://community.ops.io/jilgue/secrets-in-argocd-with-sops-pa6
        # sops:
        #   init:
        #     command: ["/bin/sh", "-c"]
        #     args: ["if [ -f 'values.sops.yaml' ]; then echo '---' > values.yaml && sops -d --input-type yaml --output-type yaml values.sops.yaml >> values.yaml; fi"]
        #   generate:
        #     command: ["/bin/sh", "-c"]
        #     args: ["cat *.yaml | yq"]
    secret:
        createSecret: ENC[AES256_GCM,data:PrrJOA==,iv:ShfoOh6fQR/CfFr7qR0duIr6MbdHdoVDHwXdjcb6jww=,tag:9Dnl0YuukYFocsJ5Dd/SnA==,type:bool]
        oidc.authentik.clientId: ENC[AES256_GCM,data:iWf7wkeuVPb23D5LW1z2ubh50ZD3bMyRn9T3K4fHSx9Ke/kSmkC9nQ==,iv:AaqWKJjalnxd9mqlYqosY0/u1/dtfMvMm8W1m0L8jJ8=,tag:QBO+V+iP9t+zMI3YN13bvA==,type:str]
        oidc.authentik.secret: ENC[AES256_GCM,data:ARt+3GL4wmvPC4z5uyDAYaDMzaohbI9uR3NHrDTIHXdGycRXCfbu+R6qsagMlLzVHcvE08JkiAjSf6INbi/D3qX7AsQzfQV1Vg5CHg9MoVTFORtJBkiLUQfxk5KBu7fF6nhWoLm2e0TSfrjt+6J9kmY0uLCiR7iGUqEOpwMYFts=,iv:OUmaJ5c2VOEyFtBQnhPvf3eKS3yG10U0C99PhxGaRRU=,tag:eUVZzEyu3QZVc+wGczL78w==,type:str]
    rbac:
        # -- Create the argocd-rbac-cm configmap with ([Argo CD RBAC policy]) definitions.
        # If false, it is expected the configmap will be created by something else.
        # Argo CD will not work if there is no configmap created with the name above.
        create: true
        policy.csv: |
            g, authentik_admins, role:admin
# -- Array of extra K8s manifests to deploy
## Note: Supports use of custom Helm templates
extraObjects: []
# - apiVersion: secrets-store.csi.x-k8s.io/v1
#   kind: SecretProviderClass
#   metadata:
#     name: argocd-secrets-store
#   spec:
#     provider: aws
#     parameters:
#       objects: |
#         - objectName: "argocd"
#           objectType: "secretsmanager"
#           jmesPath:
#               - path: "client_id"
#                 objectAlias: "client_id"
#               - path: "client_secret"
#                 objectAlias: "client_secret"
#     secretObjects:
#     - data:
#       - key: client_id
#         objectName: client_id
#       - key: client_secret
#         objectName: client_secret
#       secretName: argocd-secrets-store
#       type: Opaque
#       labels:
#         app.kubernetes.io/part-of: argocd
## Application controller
controller:
    # -- Application controller name string
    name: application-controller
    # -- The number of application controller pods to run.
    # Additional replicas will cause sharding of managed clusters across number of replicas.
    replicas: 1
    # -- Resource limits and requests for the application controller pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
## Dex
dex:
    # -- Enable dex
    enabled: false
    # -- Dex name
    name: dex-server
## Redis
redis:
    # -- Enable redis
    enabled: true
    # -- Redis name
    name: redis
    # External Redis parameters
    # externalRedis:
    #   # -- External Redis server host
    # host: "redis.databases"
    #   # -- External Redis username
    #   username: ""
    #   # -- External Redis password
    #   password: ""
    #   # -- External Redis server port
    # port: 6379
    #   # -- The name of an existing secret with Redis credentials (must contain key `redis-password`).
    #   # When it's set, the `externalRedis.password` parameter is ignored
    #   existingSecret: ""
    #   # -- External Redis Secret annotations
    #   secretAnnotations: {}
    # -- Resource limits and requests for redis
    resources:
        requests:
            cpu: 10m
            memory: 32Mi
        limits:
            cpu: 200m
            memory: 256Mi
    readinessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    livenessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
## Server
server:
    # -- Argo CD server name
    name: server
    # -- The number of server pods to run
    replicas: 1
    # -- Resource limits and requests for the server pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    ingress:
        enabled: true
        annotations:
            nginx.ingress.kubernetes.io/backend-protocol: HTTPS
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/ssl-passthrough: "true"
        ingressClassName: nginx
        path: /
        pathType: Prefix
        tls: false
        extraTls:
            - secretName: local-wildcard-cert
## Repo Server
repoServer:
    # -- Repo server name
    name: repo-server
    # -- The number of repo server pods to run
    replicas: 1
    livenessProbe:
        timeoutSeconds: 10
        initialDelaySeconds: 30
    readinessProbe:
        timeoutSeconds: 10
    # -- Resource limits and requests for the repo server pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
    # -- Environment variables to pass to repo server
    env:
        # Ensures ArgoCD invokes the helm-secrets wrapper script (which decrypts
        # secrets:// values before delegating to HELM_SECRETS_HELM_PATH) instead
        # of resolving the image's embedded helm binary directly. Without this,
        # Helm v4's plugin loader doesn't register "secrets" as a subcommand and
        # any app referencing a secrets:// values file fails to render.
        # https://github.com/jkroepke/helm-secrets/wiki/ArgoCD-Integration
        - name: PATH
          value: /gitops-tools:$(PATH)
        - name: HELM_PLUGINS
          value: /gitops-tools/helm-plugins/
        - name: HELM_SECRETS_CURL_PATH
          value: /gitops-tools/curl
        - name: HELM_SECRETS_SOPS_PATH
          value: /gitops-tools/sops
        - name: HELM_SECRETS_VALS_PATH
          value: /gitops-tools/vals
        - name: HELM_SECRETS_KUBECTL_PATH
          value: /gitops-tools/kubectl
        - name: HELM_SECRETS_BACKEND
          value: sops
        # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
        - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
          value: "false"
        - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
          value: "true"
        - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
          value: "true"
        - name: HELM_SECRETS_WRAPPER_ENABLED
          value: "true"
        - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
          value: "true"
        - name: HELM_SECRETS_HELM_PATH
          value: /usr/local/bin/helm
        - name: HELM_SECRETS_LOAD_GPG_KEYS
          # Multiple keys can be separated by space
          value: /homelab-sops-gpg/sops.asc
    # -- Init containers to add to the repo server pods
    initContainers:
        - name: download-tools
          image: docker.io/alpine:3.24.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          env:
            - name: HELM_SECRETS_VERSION
              value: 4.7.7
            - name: KUBECTL_VERSION
              value: 1.36.3
            - name: VALS_VERSION
              value: 0.45.0
            - name: SOPS_VERSION
              value: 3.13.3
          args:
            - |
              sleep 2

              mkdir -p /gitops-tools/helm-plugins

              GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/')
              wget -qO /gitops-tools/curl https://github.com/moparisthebest/static-curl/releases/download/v8.11.0/curl-${GO_ARCH}

              GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/') && \
              wget -qO /gitops-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl
              wget -qO /gitops-tools/sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}
              wget -qO- https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz | tar zxv -C /gitops-tools vals
              wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -C /gitops-tools/helm-plugins -xzf-

              chmod +x /gitops-tools/*
              cp /gitops-tools/helm-plugins/helm-secrets/scripts/wrapper/helm.sh /gitops-tools/helm
          volumeMounts:
            - mountPath: /gitops-tools
              name: gitops-tools
    # -- Additional volumeMounts to the repo server main container
    volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools
        - mountPath: /usr/local/sbin/helm
          subPath: helm
          name: gitops-tools
        - mountPath: /homelab-sops-gpg/
          name: homelab-sops-gpg
    # -- Additional volumes to the repo server pod
    volumes:
        - name: gitops-tools
          emptyDir: {}
        # kubectl create secret generic homelab-sops-gpg --from-file=sops.asc=assets/gpg/private2.gpg
        - name: homelab-sops-gpg
          secret:
            secretName: ENC[AES256_GCM,data:+/+BlF2jyC/XPxIPnIvYBw==,iv:ccGdGiUAcJ/H57YScYZlKZc+iR3zjAWy7nola5iQk/w=,tag:iH//zkniGSG36UrL8rV/7w==,type:str]
## ApplicationSet controller
applicationSet:
    # -- Enable ApplicationSet controller
    enabled: true
    # -- ApplicationSet controller name string
    name: applicationset-controller
    # -- Resource limits and requests for the application set controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
## Notifications controller
notifications:
    # -- Enable notifications controller
    enabled: true
    # -- Notifications controller name string
    name: notifications-controller
    # -- Resource limits and requests for the notifications controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    argocdUrl: ENC[AES256_GCM,data:qwGqkTaz8C7lZX7eZyDH6a0yrqpQ/wDFTnPJdkUy0o8W7A==,iv:Cvpm8K8etOO5Hz6CyBKZGFmTXKaz5KO+q3yoKljzqPM=,tag:ixN03WAAGWEfBUDmmTq5Ew==,type:str]
    secret:
        items:
            discord-webhook: ENC[AES256_GCM,data:BSUZrowoej9npdv7szy4bCoaNmtAdfP9yW83rasy5RKK6CkLJq4dAZHHdGwmLgAYt5q1WoODCWW5yG/Tp/cFRC5jWOrQ0xHsnYNHC0UmlQe719gC7WPr1rX1b/ESfRUIK+o1sHERs08aSkHN4gTdYnDqgHxevB5RMQ==,iv:WiEabEeM52PIf8K3yxg6mMmFpwKTyDnQtcXI5KiRKaw=,tag:6BbokD/WuUcHi+QFxqvWXQ==,type:str]
    notifiers:
        service.webhook.discord: |
            url: $discord-webhook
            headers:
              - name: Content-Type
                value: application/json
    templates:
        template.app-deployed: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "✅ {{.app.metadata.name}} deployed",
                      "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                      "color": 3066993,
                      "fields": [
                        {"name": "Application", "value": "[{{.app.metadata.name}}]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})", "inline": false},
                        {"name": "Cluster", "value": "{{.app.spec.destination.name}}", "inline": false},
                        {"name": "Namespace", "value": "{{.app.spec.destination.namespace}}", "inline": false},
                        {"name": "Author", "value": "{{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}", "inline": false},
                        {"name": "Revision", "value": "[{{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}})", "inline": false},
                        {"name": "Last Updated", "value": "{{.app.status.operationState.finishedAt}}", "inline": false},
                        {"name": "Commit", "value": "{{(call .repo.GetCommitMetadata .app.status.sync.revision).Message | trunc 100}}", "inline": false}
                      ]
                    }]
                  }
        template.app-health-degraded: "webhook:\n  discord:\n    method: POST\n    body: |\n      {\n        \"embeds\": [{\n          \"title\": \"\U0001F534 {{.app.metadata.name}} health degraded\",\n          \"url\": \"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}\",\n          \"color\": 15158332,\n          \"fields\": [\n            {\"name\": \"Application\", \"value\": \"[{{.app.metadata.name}}]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})\", \"inline\": false},\n            {\"name\": \"Cluster\", \"value\": \"{{.app.spec.destination.name}}\", \"inline\": false},\n            {\"name\": \"Namespace\", \"value\": \"{{.app.spec.destination.namespace}}\", \"inline\": false},\n            {\"name\": \"Health\", \"value\": \"{{.app.status.health.status}}\", \"inline\": false},\n            {\"name\": \"Last Updated\", \"value\": \"{{.app.status.reconciledAt}}\", \"inline\": false}\n          ]\n        }]\n      }\n"
        template.app-sync-failed: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "❌ {{.app.metadata.name}} sync failed",
                      "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                      "color": 15158332,
                      "fields": [
                        {"name": "Application", "value": "[{{.app.metadata.name}}]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})", "inline": false},
                        {"name": "Cluster", "value": "{{.app.spec.destination.name}}", "inline": false},
                        {"name": "Namespace", "value": "{{.app.spec.destination.namespace}}", "inline": false},
                        {"name": "Author", "value": "{{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}", "inline": false},
                        {"name": "Revision", "value": "[{{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}})", "inline": false},
                        {"name": "Last Updated", "value": "{{.app.status.operationState.finishedAt}}", "inline": false},
                        {"name": "Error", "value": "{{.app.status.operationState.message | default "N/A"}}", "inline": false}
                      ]
                    }]
                  }
    triggers:
        trigger.on-deployed: |
            - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
              oncePer: app.status.sync.revision
              send: [app-deployed]
        trigger.on-health-degraded: |
            - when: app.status.health.status in ['Degraded', 'Missing', 'Unknown']
              oncePer: app.status.reconciledAt
              send: [app-health-degraded]
        trigger.on-sync-failed: |
            - when: app.status.operationState.phase in ['Error', 'Failed']
              oncePer: app.status.sync.revision
              send: [app-sync-failed]
    subscriptions:
        - recipients:
            - discord
          triggers:
            - on-deployed
            - on-health-degraded
            - on-sync-failed
