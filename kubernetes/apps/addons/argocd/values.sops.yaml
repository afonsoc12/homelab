## Application controller
controller:
    # -- Application controller name string
    name: application-controller
    # -- The number of application controller pods to run.
    # Additional replicas will cause sharding of managed clusters across number of replicas.
    replicas: 1
    # -- Resource limits and requests for the application controller pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
## Dex
dex:
    # -- Enable dex
    enabled: false
    # -- Dex name
    name: dex-server
## Redis
redis:
    # -- Enable redis
    enabled: true
    # -- Redis name
    name: redis
    # External Redis parameters
    # externalRedis:
    #   # -- External Redis server host
    # host: "redis.databases"
    #   # -- External Redis username
    #   username: ""
    #   # -- External Redis password
    #   password: ""
    #   # -- External Redis server port
    # port: 6379
    #   # -- The name of an existing secret with Redis credentials (must contain key `redis-password`).
    #   # When it's set, the `externalRedis.password` parameter is ignored
    #   existingSecret: ""
    #   # -- External Redis Secret annotations
    #   secretAnnotations: {}
    # -- Resource limits and requests for redis
    resources:
        requests:
            cpu: 10m
            memory: 32Mi
        limits:
            cpu: 200m
            memory: 256Mi
    readinessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    livenessProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
## Server
server:
    # -- Argo CD server name
    name: server
    # -- The number of server pods to run
    replicas: 1
    # -- Resource limits and requests for the server pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    ingress:
        enabled: true
        annotations:
            nginx.ingress.kubernetes.io/backend-protocol: HTTPS
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/ssl-passthrough: "true"
        ingressClassName: nginx
        path: /
        pathType: Prefix
        tls: false
        extraTls:
            - secretName: local-wildcard-cert
## Repo Server
repoServer:
    # -- Repo server name
    name: repo-server
    # -- The number of repo server pods to run
    replicas: 1
    livenessProbe:
        timeoutSeconds: 10
        initialDelaySeconds: 30
    readinessProbe:
        timeoutSeconds: 10
    # -- Resource limits and requests for the repo server pods
    resources:
        requests:
            cpu: 250m
            memory: 256Mi
        limits:
            cpu: 2
            memory: 2Gi
    # -- Environment variables to pass to repo server
    env:
        # Ensures ArgoCD invokes the helm-secrets wrapper script (which decrypts
        # secrets:// values before delegating to HELM_SECRETS_HELM_PATH) instead
        # of resolving the image's embedded helm binary directly. Without this,
        # Helm v4's plugin loader doesn't register "secrets" as a subcommand and
        # any app referencing a secrets:// values file fails to render.
        # https://github.com/jkroepke/helm-secrets/wiki/ArgoCD-Integration
        #
        # Note: Kubernetes' $(VAR) env substitution only resolves references to
        # OTHER vars already defined in this same container's env list — it can't
        # self-reference the image's built-in PATH (set via the image's Dockerfile
        # ENV, not this list). A $(PATH) self-reference here is emitted literally,
        # wiping out /usr/bin etc. and crashing every exec (e.g. gpg) that isn't
        # under /gitops-tools. Hardcode the base image's real PATH instead.
        - name: PATH
          value: /gitops-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: HELM_PLUGINS
          value: /gitops-tools/helm-plugins/
        - name: HELM_SECRETS_CURL_PATH
          value: /gitops-tools/curl
        - name: HELM_SECRETS_SOPS_PATH
          value: /gitops-tools/sops
        - name: HELM_SECRETS_VALS_PATH
          value: /gitops-tools/vals
        - name: HELM_SECRETS_KUBECTL_PATH
          value: /gitops-tools/kubectl
        - name: HELM_SECRETS_BACKEND
          value: sops
        # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
        - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
          value: "false"
        # Argo CD resolves values files to absolute paths; required by its wrapper.
        - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
          value: "true"
        - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
          value: "false"
        - name: HELM_SECRETS_WRAPPER_ENABLED
          value: "true"
        - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
          value: "true"
        # helm-secrets' plugin.yaml still uses the legacy (pre-apiVersion) manifest
        # format, which Helm v4's plugin loader doesn't register as a subcommand.
        # Helm v3 loads it fine, so the wrapper delegates the actual "helm secrets"
        # invocation to a pinned v3 binary downloaded by the download-tools
        # initContainer, instead of the image's embedded Helm v4 binary.
        - name: HELM_SECRETS_HELM_PATH
          value: /gitops-tools/helm3
        - name: HELM_SECRETS_LOAD_GPG_KEYS
          # Multiple keys can be separated by space
          value: /homelab-sops-gpg/sops.asc
    # -- Init containers to add to the repo server pods
    initContainers:
        - name: download-tools
          image: docker.io/alpine:3.24.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          env:
            - name: HELM_SECRETS_VERSION
              value: 4.7.9
            - name: HELM3_VERSION
              value: 3.22.1
            - name: KUBECTL_VERSION
              value: 1.37.1
            - name: VALS_VERSION
              value: 0.47.0
            - name: SOPS_VERSION
              value: 3.13.3
            - name: CURL_VERSION
              value: 8.11.0
            - name: TOOL_CHECKSUMS
              value: |
                1b050abd1669f9a2ac29b34eb022cdeafb271dce5a4fb57d8ef8fadff6d7be1f  curl-8.11.0-aarch64
                d18aa1f4e03b50b649491ca2c401cd8c5e89e72be91ff758952ad2ab5a83135d  curl-8.11.0-amd64
                bbdfcf121bbbe5e9525f63ed50ad2e07c43034fc3762f488563061620b76b1be  helm-secrets-4.7.9.tar.gz
                896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  helm-v3.22.1-linux-amd64.tar.gz
                4c29e286b279d170fa048ddfc3e4e83dcd069ca9c52102766ba672d7149e694d  helm-v3.22.1-linux-arm64.tar.gz
                65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  kubectl-v1.37.1-linux-amd64
                ff749f4b78d9c4f1ec87307df9b50119ed819e2094aa9810cb9acffc3286c8c7  kubectl-v1.37.1-linux-arm64
                e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops-v3.13.3.linux.amd64
                53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77  sops-v3.13.3.linux.arm64
                b327e52811c0c84c5adad26bf2536491e07fc75018a84a66109e1e5325a3d833  vals_0.47.0_linux_amd64.tar.gz
                835f3d5d438ab92ce7929498b6fe0543d1972efde39cfd956b1ecda3dc6adff7  vals_0.47.0_linux_arm64.tar.gz
          args:
            - |
              set -eu

              case "$(uname -m)" in
                x86_64) GO_ARCH=amd64; CURL_ARCH=amd64 ;;
                aarch64|arm64) GO_ARCH=arm64; CURL_ARCH=aarch64 ;;
                *) echo "Unsupported tool architecture" >&2; exit 1 ;;
              esac

              mkdir -p /gitops-tools/helm-plugins /tmp/verified-tools
              printf '%s\n' "$TOOL_CHECKSUMS" > /tmp/verified-tools/checksums
              cd /tmp/verified-tools

              download() {
                asset="$1"
                url="$2"
                expected=$(awk -v asset="$asset" '$2 == asset { print $1 }' checksums)
                test "${#expected}" -eq 64
                wget -qO "$asset" "$url"
                printf '%s  %s\n' "$expected" "$asset" | sha256sum -c -
              }

              download "curl-${CURL_VERSION}-${CURL_ARCH}" "https://github.com/moparisthebest/static-curl/releases/download/v${CURL_VERSION}/curl-${CURL_ARCH}"
              download "kubectl-v${KUBECTL_VERSION}-linux-${GO_ARCH}" "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl"
              download "sops-v${SOPS_VERSION}.linux.${GO_ARCH}" "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}"
              download "vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz" "https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz"
              download "helm-secrets-${HELM_SECRETS_VERSION}.tar.gz" "https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz"
              download "helm-v${HELM3_VERSION}-linux-${GO_ARCH}.tar.gz" "https://get.helm.sh/helm-v${HELM3_VERSION}-linux-${GO_ARCH}.tar.gz"

              cp "curl-${CURL_VERSION}-${CURL_ARCH}" /gitops-tools/curl
              cp "kubectl-v${KUBECTL_VERSION}-linux-${GO_ARCH}" /gitops-tools/kubectl
              cp "sops-v${SOPS_VERSION}.linux.${GO_ARCH}" /gitops-tools/sops
              tar -xzf "vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz" -C /gitops-tools vals
              tar -xzf "helm-secrets-${HELM_SECRETS_VERSION}.tar.gz" -C /gitops-tools/helm-plugins
              tar -xzf "helm-v${HELM3_VERSION}-linux-${GO_ARCH}.tar.gz" -C /gitops-tools --strip-components=1 "linux-${GO_ARCH}/helm"
              mv /gitops-tools/helm /gitops-tools/helm3
              cp /gitops-tools/helm-plugins/helm-secrets/scripts/wrapper/helm.sh /gitops-tools/helm
              chmod 0755 /gitops-tools/curl /gitops-tools/kubectl /gitops-tools/sops /gitops-tools/vals /gitops-tools/helm3 /gitops-tools/helm
          volumeMounts:
            - mountPath: /gitops-tools
              name: gitops-tools
    # -- Additional volumeMounts to the repo server main container
    volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools
        - mountPath: /usr/local/sbin/helm
          subPath: helm
          name: gitops-tools
        - mountPath: /homelab-sops-gpg/
          name: homelab-sops-gpg
          readOnly: true
    # -- Additional volumes to the repo server pod
    volumes:
        - name: gitops-tools
          emptyDir: {}
        # kubectl create secret generic homelab-sops-gpg --from-file=sops.asc=assets/gpg/private2.gpg
        - name: homelab-sops-gpg
          secret:
            secretName: ENC[AES256_GCM,data:dO0krWu0sUY4hfBQk34oLQ==,iv:nn3dxKg9+Lw9Z4dPy1DYuRRh/4jBSZrmZb8++SNXFtg=,tag:v481ntQxZuuvN55CVMa4uA==,type:str]
## ApplicationSet controller
applicationSet:
    # -- Enable ApplicationSet controller
    enabled: true
    # -- ApplicationSet controller name string
    name: applicationset-controller
    # -- Resource limits and requests for the application set controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    readinessProbe:
        enabled: true
    livenessProbe:
        enabled: true
    startupProbe:
        enabled: true
## Notifications controller
notifications:
    # -- Enable notifications controller
    enabled: true
    # -- Notifications controller name string
    name: notifications-controller
    # -- Resource limits and requests for the notifications controller pods
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 256Mi
    argocdUrl: ENC[AES256_GCM,data:BPvH06zcVIbNwExJczi7fdFdg2VfsLLhwOd/tvxYgvwxPg==,iv:v3rs1Z69zOTRImX8yJ70s0W/sAsxVBJ6MdAGTPyorYk=,tag:grlG1+NANHVMeUjS1+6Ung==,type:str]
    secret:
        items:
            discord-webhook: ENC[AES256_GCM,data:juNBNlXhLOTo9InwVdm4jl3D+awpetQt7o3JMI2IhxuPvtR12vkVYHT4vmEIQn8u/1I65bAc4r0ypSisx3R/V4BrdYf3Q3wESLjLZMxZulUKtb/FY0LTym2KKByFOo/eN/e75KefEjdJhqXGhZ6xZvQGf16wNgq9qA==,iv:E3jRl3jvkwZyPfMHkloSQcS8JUlGeMpp1NFsjjcJ6ws=,tag:wtxaohMZADpTU4+eUm5p/w==,type:str]
    notifiers:
        service.webhook.discord: |
            url: $discord-webhook
            headers:
              - name: Content-Type
                value: application/json
    templates:
        # Message layout mirrors the Prometheus Alertmanager Discord notifier
        # (kubernetes/apps/monitoring/prometheus-stack): status emoji + event
        # name title, quote-block body with a bold summary line, cluster/
        # namespace/timestamp context line, then markdown links.
        template.app-deployed: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "🟢 AppDeployed · `{{.app.spec.destination.name}}`",
                      "color": 3066993,
                      "description": "> **{{.app.metadata.name}} synced successfully**\n> {{(call .repo.GetCommitMetadata .app.status.sync.revision).Message | trunc 100}}\n> 📦 `{{.app.spec.destination.namespace}}` · 🕒 {{.app.status.operationState.finishedAt}}\n> [🔍 App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}}) · [📝 {{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}}) by {{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}"
                    }]
                  }
        template.app-health-degraded: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "🔴 AppHealthDegraded · `{{.app.spec.destination.name}}`",
                      "color": 15158332,
                      "description": "> **{{.app.metadata.name}} health degraded**\n> Health status: `{{.app.status.health.status}}`\n> 📦 `{{.app.spec.destination.namespace}}` · 🕒 {{.app.status.reconciledAt}}\n> [🔍 App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})"
                    }]
                  }
        template.app-sync-failed: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "🔴 AppSyncFailed · `{{.app.spec.destination.name}}`",
                      "color": 15158332,
                      "description": "> **{{.app.metadata.name}} sync failed**\n> {{.app.status.operationState.message | default \"No error message\"}}\n> 📦 `{{.app.spec.destination.namespace}}` · 🕒 {{.app.status.operationState.finishedAt}}\n> [🔍 App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}}) · [📝 {{.app.status.sync.revision | trunc 7}}]({{call .repo.RepoURLToHTTPS .app.spec.source.repoURL}}/commit/{{.app.status.sync.revision}}) by {{(call .repo.GetCommitMetadata .app.status.sync.revision).Author}}"
                    }]
                  }
        template.app-sync-status-unknown: |
            webhook:
              discord:
                method: POST
                body: |
                  {
                    "embeds": [{
                      "title": "🟡 AppSyncStatusUnknown · `{{.app.spec.destination.name}}`",
                      "color": 15105570,
                      "description": "> **{{.app.metadata.name}} sync status unknown**\n> ArgoCD could not determine whether the live state matches Git — check for CRD issues or repo access errors.\n> 📦 `{{.app.spec.destination.namespace}}` · 🕒 {{.app.status.reconciledAt}}\n> [🔍 App]({{.context.argocdUrl}}/applications/{{.app.metadata.name}})"
                    }]
                  }
    triggers:
        trigger.on-deployed: |
            - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
              oncePer: app.status.sync.revision
              send: [app-deployed]
        trigger.on-health-degraded: |
            - when: app.status.health.status in ['Degraded', 'Missing', 'Unknown']
              oncePer: app.status.reconciledAt
              send: [app-health-degraded]
        trigger.on-sync-failed: |
            - when: app.status.operationState.phase in ['Error', 'Failed']
              oncePer: app.status.sync.revision
              send: [app-sync-failed]
        trigger.on-sync-status-unknown: |
            - when: app.status.sync.status == 'Unknown'
              oncePer: app.status.reconciledAt
              send: [app-sync-status-unknown]
    subscriptions:
        - recipients:
            - discord
          triggers:
            - on-deployed
            - on-health-degraded
            - on-sync-failed
            - on-sync-status-unknown
    readinessProbe:
        enabled: true
    livenessProbe:
        enabled: true
    startupProbe:
        enabled: true
