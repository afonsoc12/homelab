# --------------------
# Ollama Web UI ingress
#   - Chart: contour-ingress
# --------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-ingress
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:afonsoc12/homelab.git
    targetRevision: HEAD
    path: kubernetes/charts/contour-ingress
    helm:
      valueFiles:
        - secrets://../../apps/values.sops.yaml
        - ../../apps/homelab/ollama-ingress/values.yaml
  destination:
    name: {{ .Values.spec.destination.name }}
    namespace: homelab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
