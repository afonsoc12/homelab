# --------------------
# Music Assistant Resources (extra ingress)
#   - Chart: adhoc-resources
# --------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: music-assistant-resources
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:afonsoc12/homelab.git
    targetRevision: HEAD
    path: kubernetes/charts/adhoc-resources
    helm:
      valueFiles:
        - secrets://../../apps/values.sops.yaml
        - ../../apps/automation/music-assistant-resources/values.yaml
  destination:
    name: {{ .Values.spec.destination.name }}
    namespace: automation

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
