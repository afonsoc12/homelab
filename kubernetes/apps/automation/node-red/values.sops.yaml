replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: ghcr.io/afonsoc12/node-red-oidc
    tag: 5.0.9-oidc.1
    pullPolicy: Always
hostNetwork: true
ports:
    - containerPort: 1880
      name: http
      protocol: TCP
      service: true
service:
    enabled: true
volumeMounts:
    - name: data
      mountPath: /data
volumes:
    - name: data
      mountPvc: true
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 500Mi
ingress:
    enabled: true
    className: contour
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: node-red.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
              service:
                name: authentik-automation-proxy
                port: 9000
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 60s
        projectcontour.io/websocket-routes: /
podSecurityContext:
    fsGroup: 1000
nodeSelector:
    kubernetes.io/hostname: k3s-m1
tolerations: []
affinity: {}
resources:
    limits:
        cpu: 500m
        memory: 192Mi
    requests:
        cpu: 50m
        memory: 96Mi
livenessProbe:
    tcpSocket:
        port: 1880
        host: 127.0.0.1
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    httpGet:
        path: /
        host: 127.0.0.1
        port: 1880
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 30
startupProbe:
    httpGet:
        path: /
        host: 127.0.0.1
        port: 1880
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 30
secret:
    mountEnv: true
    stringData:
        NODE_RED_OIDC_CONFIG: ENC[AES256_GCM,data:,iv:Sdk9HpxN1kmDK4PTLrz3qL6z41IxfJ41hEeSCKuBzTE=,tag:4YYIss2kjTG4hTCmf81KLg==,type:str]
