# --------------------
# Grocy
#   - Repo:           https://github.com/grocy/grocy
#   - Docs:           https://grocy.info/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
---
replicas: 1
image:
  repository: ghcr.io/linuxserver/grocy
  tag: 4.7.1
ports:
  - containerPort: 80
    service: true

service:
  enabled: true

volumeMounts:
  - name: config
    mountPath: /config

volumes:
  - name: config
    mountPvc: true

pvc:
  storageClassName: longhorn-persistent
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
configmap:
  mountEnv: true
  data:
    GROCY_AUTH_CLASS: "Grocy\\Middleware\\Auth\\ReverseProxyAuthMiddleware"
    GROCY_REVERSE_PROXY_AUTH_HEADER: X-authentik-username

ingress:
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    projectcontour.io/response-timeout: 60s
    projectcontour.io/websocket-routes: /

  backend:
    name: authentik-automation-proxy
    port: 9000
  enabled: true
  authelia: false
  className: contour
  tls:
    - secretName: local-wildcard-cert
  hosts:
    - host: grocy.local.{{ .Values.domain }}
      paths:
        - path: /
          pathType: Prefix

extraResources:
  # Only the authentication proxy and the existing Home Assistant integration
  # should reach an application that trusts proxy-supplied usernames.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: grocy-auth-proxy
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: grocy
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: authentik-outpost-proxy
                  goauthentik.io/outpost-name: automation-proxy
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: home-assistant
          ports:
            - port: 80
              protocol: TCP

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  tcpSocket:
    port: 80
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  tcpSocket:
    port: 80
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

startupProbe:
  tcpSocket:
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 18
  timeoutSeconds: 5
