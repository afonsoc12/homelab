replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/homeassistant/home-assistant
    tag: 2026.11.0
    pullPolicy: Always
hostNetwork: true
# Install and configure the pinned OIDC integration before Home Assistant starts.
initContainers:
    - name: configure-oidc
      image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
      command: ["python3", "-c"]
      env:
          - name: HA_OIDC_CONFIGURATION
            valueFrom:
                secretKeyRef:
                    name: home-assistant
                    key: auth-oidc.yaml
          - name: HA_OIDC_CONFIGURATION_SHA256
            value: '{{ index .Values.secret.stringData "auth-oidc.yaml" | sha256sum }}'
      volumeMounts:
          - name: config
            mountPath: /config
      args:
          - |
              import hashlib
              import io
              import json
              import os
              from pathlib import Path
              import shutil
              import subprocess
              import sys
              import tempfile
              import urllib.request
              import zipfile

              import yaml

              version = "1.2.1"
              release_hash = "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
              config_dir = Path("/config")


              def atomic_write(path, data):
                  descriptor, temporary = tempfile.mkstemp(dir=path.parent)
                  try:
                      with os.fdopen(descriptor, "wb") as output:
                          output.write(data)
                      os.replace(temporary, path)
                  finally:
                      Path(temporary).unlink(missing_ok=True)


              cache = config_dir / ".cache" / f"auth_oidc-{version}.zip"
              cache.parent.mkdir(parents=True, exist_ok=True)
              archive = cache.read_bytes() if cache.exists() else b""
              if hashlib.sha256(archive).hexdigest() != release_hash:
                  request = urllib.request.Request(
                      f"https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v{version}/hass-oidc-auth.zip",
                      headers={"User-Agent": "HomeAssistant-OIDC-installer"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      archive = response.read()
                  if hashlib.sha256(archive).hexdigest() != release_hash:
                      raise RuntimeError("OIDC release checksum mismatch")
                  atomic_write(cache, archive)

              component = config_dir / "custom_components" / "auth_oidc"
              component.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  files = [entry for entry in bundle.infolist() if not entry.is_dir()]
                  if any(
                      Path(entry.filename).is_absolute()
                      or ".." in Path(entry.filename).parts
                      or any(part.startswith("._") or part == "__MACOSX" for part in Path(entry.filename).parts)
                      for entry in files
                  ):
                      raise RuntimeError("Invalid OIDC release paths")
                  if json.loads(bundle.read("manifest.json"))["version"] != version:
                      raise RuntimeError("OIDC release version mismatch")
                  matches = all(
                      (component / entry.filename).is_file()
                      and (component / entry.filename).read_bytes() == bundle.read(entry)
                      for entry in files
                  )
                  if not matches or any(component.rglob("._*")):
                      staging = Path(tempfile.mkdtemp(prefix=".auth_oidc-", dir=component.parent))
                      previous = component.with_name(".auth_oidc-previous")
                      try:
                          bundle.extractall(staging)
                          if component.exists():
                              shutil.rmtree(previous, ignore_errors=True)
                              component.rename(previous)
                          try:
                              staging.rename(component)
                          except Exception:
                              if previous.exists():
                                  previous.rename(component)
                              raise
                          shutil.rmtree(previous, ignore_errors=True)
                      finally:
                          shutil.rmtree(staging, ignore_errors=True)

              desired = os.environ["HA_OIDC_CONFIGURATION"].encode()
              if hashlib.sha256(desired).hexdigest() != os.environ["HA_OIDC_CONFIGURATION_SHA256"]:
                  raise RuntimeError("OIDC configuration checksum mismatch")
              if not isinstance(yaml.safe_load(desired), dict):
                  raise RuntimeError("OIDC configuration must be a mapping")

              configuration = config_dir / "configuration.yaml"
              original = configuration.read_bytes()
              source = original.decode()
              root = yaml.compose(source)
              entries = [(key, value) for key, value in root.value if key.value == "auth_oidc"]
              if len(entries) > 1:
                  raise RuntimeError("Duplicate OIDC configuration")
              include = "auth_oidc: !include auth-oidc.yaml\n"
              if entries:
                  key, value = entries[0]
                  updated = source[:key.start_mark.index] + include + source[value.end_mark.index:].lstrip("\n")
              else:
                  updated = source.rstrip() + "\n\n" + include

              managed = config_dir / "auth-oidc.yaml"
              previous_config = managed.read_bytes() if managed.exists() else None
              atomic_write(managed, desired)
              if updated.encode() != original:
                  atomic_write(configuration, updated.encode())
              result = subprocess.run(
                  [sys.executable, "-m", "homeassistant", "--script", "check_config", "-c", str(config_dir)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              if result.returncode:
                  atomic_write(configuration, original)
                  if previous_config is None:
                      managed.unlink()
                  else:
                      atomic_write(managed, previous_config)
                  raise RuntimeError("Home Assistant configuration validation failed")
              print(f"OIDC {version} verified and GitOps configuration validated")
ports:
    - containerPort: 8123
      name: http
      protocol: TCP
      service: true
# Uses ports from .ports section, if service is true
service:
    enabled: true
volumeMounts:
    - name: config
      mountPath: /config
volumes:
    - name: config
      mountPvc: true
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
ingress:
    enabled: true
    className: contour
    annotations:
        ingress.kubernetes.io/force-ssl-redirect: "true"
        projectcontour.io/response-timeout: 300s
        projectcontour.io/websocket-routes: /
    tls:
        - secretName: home-cert
    # Will assume the first element in .ports, regardless of service
    hosts:
        - host: home.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
nodeSelector:
    kubernetes.io/hostname: k3s-m1
tolerations: []
affinity: {}
resources:
    limits:
        cpu: "2"
        memory: 1600Mi
    requests:
        cpu: 500m
        memory: 800Mi
livenessProbe:
    tcpSocket:
        port: 8123
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 8123
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 8123
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
# Prometheus scrape secret + alerting
#   - Docs: https://www.home-assistant.io/integrations/prometheus/
# Keep logs in container output, where kubelet manages rotation.
configmap:
    mountEnv: true
    data:
        HA_DISABLE_LOG_FILE: "true"
secret:
    stringData:
        prometheus-token: ENC[AES256_GCM,data:fYESSX4gg115aNAJdCsPjqouKcff6mRarehXwEr2HVYJfocAu4435nnxo2vxWRKXH3/9xjrOgAEI6WDvKtRclV4NyM1Qk+BLqcdt52kjkwk5s5jzX5156WelETiiuhqLUOtP/Yp9EnRArIWVP/UJen2efB9x7Sfns5WJZy7+Zeu+AsXNbnNNqDWCww5JQU1ln8CZQqahfnos7OJLekAwDPPqi3kwlI+Nk53S/k3PHwe4cQuz1W+p,iv:8g2AzzMWU6FKhMRnvZR3c2mk/80Q8beO4LGsKd9Tkek=,tag:2tLzqOH11XA5avubsotAow==,type:str]
        auth-oidc.yaml: ENC[AES256_GCM,data:,iv:f2FPSgKmy37WOYD7ffH5636TqGjMasYo047V+vwD+ng=,tag:N1r0YrB7yQAOGTO9+RJP2A==,type:str]
serviceMonitor:
    enabled: true
    endpoints:
        - port: http
          path: /api/prometheus
          interval: 60s
          bearerTokenSecret:
            name: home-assistant
            key: prometheus-token
prometheusRule:
    enabled: true
    groups:
        - name: HomeAssistant
          rules:
            - alert: HomeAssistantDown
              expr: up{job="home-assistant"} == 0
              for: 5m
              labels:
                severity: critical
                hostname: home-assistant
              annotations:
                summary: Home Assistant is unreachable
                description: Prometheus has not been able to scrape Home Assistant for 5 minutes. Automations and integrations may be down.
            - alert: HomeAssistantBatteryLow
              expr: homeassistant_sensor_battery_percent < 20
              for: 6h
              labels:
                severity: warning
                hostname: home-assistant
              annotations:
                summary: 'Battery low: {{ $labels.friendly_name }}'
                description: '{{ $labels.friendly_name }} battery is at {{ $value }}% for over 6 hours.'
            - alert: HomeAssistantBatteryStale
              expr: (time() - timestamp(homeassistant_sensor_battery_percent)) > 172800
              for: 0m
              labels:
                severity: warning
                hostname: home-assistant
              annotations:
                summary: 'Battery sensor stopped reporting: {{ $labels.friendly_name }}'
                description: '{{ $labels.friendly_name }} has not reported a battery reading in over 48 hours — device may be offline or dead.'
