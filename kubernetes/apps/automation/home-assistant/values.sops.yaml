# --------------------
# Home Assistant
#   - Repo:           https://github.com/home-assistant/core
#   - Docs:           https://www.home-assistant.io/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/homelab-svc/values.yaml
# --------------------
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/homeassistant/home-assistant
    tag: 2026.9.1
    pullPolicy: Always
hostNetwork: true
ports:
    - containerPort: 8123
      name: http
      protocol: TCP
      service: true
# Uses ports from .ports section, if service is true
service:
    enabled: true
volumeMounts:
    - name: config
      mountPath: /config
volumes:
    - name: config
      mountPvc: true
pvc:
    storageClassName: longhorn-persistent
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
ingress:
    enabled: true
    authelia: true
    className: nginx
    tls:
        - secretName: home-cert
    # Will assume the first element in .ports, regardless of service
    hosts:
        - host: home.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
nodeSelector:
    kubernetes.io/hostname: k3s-m1
tolerations: []
affinity: {}
resources:
    limits:
        cpu: 200m
        memory: 1600Mi
    requests:
        cpu: 100m
        memory: 800Mi
livenessProbe:
    tcpSocket:
        port: 8123
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 8123
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 8123
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 18
    timeoutSeconds: 5
# Prometheus scrape secret + alerting
#   - Docs: https://www.home-assistant.io/integrations/prometheus/
secret:
    stringData:
        prometheus-token: ENC[AES256_GCM,data:fYESSX4gg115aNAJdCsPjqouKcff6mRarehXwEr2HVYJfocAu4435nnxo2vxWRKXH3/9xjrOgAEI6WDvKtRclV4NyM1Qk+BLqcdt52kjkwk5s5jzX5156WelETiiuhqLUOtP/Yp9EnRArIWVP/UJen2efB9x7Sfns5WJZy7+Zeu+AsXNbnNNqDWCww5JQU1ln8CZQqahfnos7OJLekAwDPPqi3kwlI+Nk53S/k3PHwe4cQuz1W+p,iv:8g2AzzMWU6FKhMRnvZR3c2mk/80Q8beO4LGsKd9Tkek=,tag:2tLzqOH11XA5avubsotAow==,type:str]
serviceMonitor:
    enabled: true
    endpoints:
        - port: http
          path: /api/prometheus
          interval: 60s
          bearerTokenSecret:
            name: home-assistant
            key: prometheus-token
prometheusRule:
    enabled: true
    groups:
        - name: HomeAssistant
          rules:
            - alert: HomeAssistantDown
              expr: up{job="home-assistant"} == 0
              for: 5m
              labels:
                severity: critical
                hostname: home-assistant
              annotations:
                summary: Home Assistant is unreachable
                description: Prometheus has not been able to scrape Home Assistant for 5 minutes. Automations and integrations may be down.
            - alert: HomeAssistantBatteryLow
              expr: homeassistant_sensor_battery_percent < 20
              for: 6h
              labels:
                severity: warning
                hostname: home-assistant
              annotations:
                summary: 'Battery low: {{ $labels.friendly_name }}'
                description: '{{ $labels.friendly_name }} battery is at {{ $value }}% for over 6 hours.'
            - alert: HomeAssistantBatteryStale
              expr: (time() - timestamp(homeassistant_sensor_battery_percent)) > 172800
              for: 0m
              labels:
                severity: warning
                hostname: home-assistant
              annotations:
                summary: 'Battery sensor stopped reporting: {{ $labels.friendly_name }}'
                description: '{{ $labels.friendly_name }} has not reported a battery reading in over 48 hours — device may be offline or dead.'
