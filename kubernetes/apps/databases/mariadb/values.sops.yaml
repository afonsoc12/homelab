# --------------------
# MariaDB
#   - Repo:           https://github.com/MariaDB/server
#   - Docs:           https://mariadb.org/documentation/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/database-svc/values.yaml
# --------------------
labels:
    tier: db
    # label_2: def
podAnnotations: {}
# annot_1: abc
# annot_2: def
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/mariadb
    tag: 13.0.2
#   pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 3306
      name: mysql
      protocol: TCP
      service: true
    - containerPort: 9104
      name: metrics
      protocol: TCP
      service: true
service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: ENC[AES256_GCM,data:LRhePZf05WdTtic=,iv:/YVuCUebQTh+engYW2OSFo0ZpNyL0AgOU88mB0XgvHI=,tag:x6CecSkpDfcX7GmqF85ssg==,type:str]
    annotations:
        metallb.universe.tf/allow-shared-ip: db-svc
secret:
    stringData:
        MYSQL_ROOT_PASSWORD: ENC[AES256_GCM,data:E1JB0960ta03h2n/HsUzoVfhvSw=,iv:GZgpXZp4PSuNHl3gLf130Jg502mfD/Bz43erkkQVJmI=,tag:DUq6o95iDx83LCuQkWSzGg==,type:str]
        MYSQLD_EXPORTER_PASSWORD: ENC[AES256_GCM,data:NqgOY2dfObO56vk84e9NMmfSmEQ=,iv:BqffRKHvATymvlIfp1+fPy+dauFRCJBXZybjVDt0JKg=,tag:j6M0m3z0RyrqmHpvBznVcw==,type:str]
configmap: {}
# config_1: abc
# config_2: def
volumeMounts:
    - name: data
      mountPath: /var/lib/mysql
volumeClaimTemplates:
    - name: data
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 10Gi
livenessProbe:
    tcpSocket:
        port: 3306
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 3306
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 3306
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
resources:
    limits:
        cpu: 1
        memory: 1Gi
    requests:
        cpu: 50m
        memory: 128Mi
podSecurityContext: {}
# fsGroup: 2000
securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000
nodeSelector: {}
tolerations: []
affinity: {}
extraContainers:
    - name: mysqld-exporter
      image: docker.io/prom/mysqld-exporter:v0.20.0
      ports:
        - containerPort: 9104
          name: metrics
          protocol: TCP
      env:
        - name: MYSQLD_EXPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
                name: mariadb
                key: MYSQLD_EXPORTER_PASSWORD
      args:
        - --mysqld.address=localhost:3306
        - --mysqld.username=mysqld_exporter
        - --collect.global_status
        - --collect.global_variables
        - --collect.info_schema.innodb_metrics
        - --collect.info_schema.processlist
        - --collect.info_schema.tables
        - --collect.perf_schema.eventsstatements
        # - --collect.slave_status
        # - --collect.auto_increment.columns
        # - --collect.binlog_size
        # - --collect.perf_schema.tableiowaits
        # - --collect.perf_schema.tablelocks
      resources:
        requests:
            cpu: 5m
            memory: 16Mi
        limits:
            cpu: 5m
            memory: 16Mi
backup:
    enabled: true
    schedule: 0 3 * * *
    rootPasswordKey: MYSQL_ROOT_PASSWORD
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    prometheusRule:
        enabled: true
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    # community edition: retention.within only supports minutes (129600m = 90d)
    configmap:
        data:
            db-backup.yml: ENC[AES256_GCM,data:,iv:TdxDDKvOFhgPZ1V96Xn7bB4THXiLqwlJgNOY4zbfTls=,tag:hI3l6/FAl+OdpvJNY3QMBA==,type:str]
    affinity:
        podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                        - key: tier
                          operator: In
                          values:
                            - db
                  topologyKey: kubernetes.io/hostname
    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 100m
            memory: 256Mi
