# --------------------
# InfluxDB
#   - Repo:           https://github.com/influxdata/influxdb
#   - Docs:           https://docs.influxdata.com/influxdb/v2/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/database-svc/values.yaml
# --------------------
labels:
    tier: db
podAnnotations: {}
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/influxdb
    tag: 3.11.0-enterprise
comand:
    - influxdb3
args:
    - serve
    - --cluster-id=k3s-cluster
    - --node-id=$HOSTNAME
    - --object-store=file
    - --data-dir=/var/lib/influxdb3/data
    - --plugin-dir=/var/lib/influxdb3/plugins
ports:
    - containerPort: 8181
      name: influxdb
      protocol: TCP
      service: true
service:
    enabled: true
secret:
    stringData:
        INFLUXDB3_LICENSE_EMAIL: ENC[AES256_GCM,data:0M9t6lBpn3D2sy4UVHsYgrX2Dwzq7mqQnQ==,iv:l0QFo6iKNjyFsfLSgUdBd/fummCwKV6Ytvwt3gVdRpU=,tag:8dnlRStJatPpyKYuwKdE7w==,type:str]
        INFLUXDB3_LICENSE_TYPE: ENC[AES256_GCM,data:cr9Ywg==,iv:VwdbNfBVAuFnuy3lNRlM1SO/Ve3XRKEY7IPk/g9Hwo8=,tag:IehDcq2jtbpeti4jvBFqVQ==,type:str]
volumeMounts:
    - name: data
      mountPath: /var/lib/influxdb3
volumeClaimTemplates:
    - name: data
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 5Gi
livenessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 8181
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
resources:
    requests:
        memory: 128Mi
        cpu: 0.2
    limits:
        memory: 1Gi
        cpu: 1
podSecurityContext:
    fsGroup: 1000
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
backup:
    enabled: false
sops:
    encrypted_regex: ^(data|stringData|loadBalancerIP|nginx.ingress.kubernetes.io/auth-signin)$
