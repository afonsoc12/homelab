# --------------------
# InfluxDB
#   - Repo:           https://github.com/influxdata/influxdb
#   - Docs:           https://docs.influxdata.com/influxdb/v2/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/database-svc/values.yaml
# --------------------
labels:
    tier: db
podAnnotations: {}
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/influxdb
    tag: 3.11.0-enterprise
comand:
    - influxdb3
args:
    - serve
    - --cluster-id=k3s-cluster
    - --node-id=$HOSTNAME
    - --object-store=file
    - --data-dir=/var/lib/influxdb3/data
    - --plugin-dir=/var/lib/influxdb3/plugins
# influxdb-ui listed first so ingress (which always targets the first port) routes to the UI
ports:
    - containerPort: 8080
      name: influxdb-ui
      protocol: TCP
      service: true
    - containerPort: 8181
      name: influxdb
      protocol: TCP
      service: true
service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: ENC[AES256_GCM,data:5Sxc4HK/lSUKAdU=,iv:+qaevk3PvmrrWJHvTKiwgMGxEziL3dSg3SRo8NICkng=,tag:AK5cG+boAMHXDaATX+SxCw==,type:str]
    annotations:
        metallb.universe.tf/allow-shared-ip: db-svc

ingress:
    enabled: true
    authelia: true
    className: nginx
    annotations: {}
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: influxdb.local.{{ .Values.domain }}
          paths:
              - path: /
                pathType: Prefix
secret:
    stringData:
        INFLUXDB3_LICENSE_EMAIL: ENC[AES256_GCM,data:0M9t6lBpn3D2sy4UVHsYgrX2Dwzq7mqQnQ==,iv:l0QFo6iKNjyFsfLSgUdBd/fummCwKV6Ytvwt3gVdRpU=,tag:8dnlRStJatPpyKYuwKdE7w==,type:str]
        INFLUXDB3_LICENSE_TYPE: ENC[AES256_GCM,data:cr9Ywg==,iv:VwdbNfBVAuFnuy3lNRlM1SO/Ve3XRKEY7IPk/g9Hwo8=,tag:IehDcq2jtbpeti4jvBFqVQ==,type:str]
        config.json: ENC[AES256_GCM,data:,iv:ypoL/iwuYI27XjsuYMDiFlpiAlv4nRq6T2pabyD7LC8=,tag:xozpiBVLr1P7cxEZ7rRfgg==,type:str]
volumeMounts:
    - name: data
      mountPath: /var/lib/influxdb3
volumeClaimTemplates:
    - name: data
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 5Gi
    - name: ui-db
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 128Mi
# config.json (server URL + admin token) is mounted read-only at /app-root/config
volumes:
    - name: ui-config
      secret:
        secretName: influxdb
extraContainers:
    - name: influxdb-ui
      image: docker.io/influxdata/influxdb3-ui:1.9.0
      imagePullPolicy: IfNotPresent
      # --mode=admin enables database/token management (Create Database, etc.) in the UI
      args:
          - --mode=admin
      ports:
          - containerPort: 8080
            name: influxdb-ui
            protocol: TCP
      # influxdb3-ui runs as non-root user influxui (uid 1500); the pod's fsGroup grants it
      # group write access to the ui-db PVC without conflicting with the influxdb container
      securityContext:
          runAsUser: 1500
          runAsNonRoot: true
      volumeMounts:
          - name: ui-config
            mountPath: /app-root/config
            readOnly: true
          - name: ui-db
            mountPath: /db
      livenessProbe:
          tcpSocket:
              port: 8080
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
      readinessProbe:
          tcpSocket:
              port: 8080
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
      startupProbe:
          tcpSocket:
              port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 18
          timeoutSeconds: 5
      resources:
          requests:
              memory: 64Mi
              cpu: 25m
          limits:
              memory: 256Mi
              cpu: 100m
livenessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 8181
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
resources:
    requests:
        memory: 128Mi
        cpu: 0.2
    limits:
        memory: 1Gi
        cpu: 1
podSecurityContext:
    fsGroup: 1000
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
backup:
    enabled: false
