# --------------------
# InfluxDB
#   - Repo:           https://github.com/influxdata/influxdb
#   - Docs:           https://docs.influxdata.com/influxdb/v2/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/database-svc/values.yaml
# --------------------
labels:
    tier: db
podAnnotations: {}
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/influxdb
    tag: 3.11.2-enterprise
comand:
    - influxdb3
args:
    - serve
    - --cluster-id=k3s-cluster
    - --node-id=$HOSTNAME
    - --object-store=file
    - --data-dir=/var/lib/influxdb3/data
    - --plugin-dir=/var/lib/influxdb3/plugins
# influxdb-ui listed first so ingress (which always targets the first port) routes to the UI
ports:
    - containerPort: 8080
      name: influxdb-ui
      protocol: TCP
      service: true
    - containerPort: 8181
      name: influxdb
      protocol: TCP
      service: true
service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: ENC[AES256_GCM,data:EDvg8iw15o0hszw=,iv:OcKywMnW9YdoUQT22nGkZjwKt9y9Lj4/7cQ/xja8Uzg=,tag:t9c183mKBTgLK0j+HaI/aA==,type:str]
    annotations:
        metallb.universe.tf/allow-shared-ip: db-svc
ingress:
    enabled: true
    authelia: true
    className: nginx
    annotations: {}
    tls:
        - secretName: local-wildcard-cert
    hosts:
        - host: influxdb.local.{{ .Values.domain }}
          paths:
            - path: /
              pathType: Prefix
secret:
    stringData:
        INFLUXDB3_LICENSE_EMAIL: ENC[AES256_GCM,data:pmcAaNoFgXez8ESR0E2MPfACdc29kpq9Gg==,iv:ThdvC2KXakOP4GhMVaajAofsQct90qxzOwR1POBID2A=,tag:AQM1Urm43VofLUHGIf0RPw==,type:str]
        INFLUXDB3_LICENSE_TYPE: ENC[AES256_GCM,data:ORozNg==,iv:wQx5ArLIgqlZL1LrbsU75qjpSOz4cjTxmyrGnBayL8o=,tag:NOxrRdGi/vWrNJpm8k85Mw==,type:str]
        config.json: ENC[AES256_GCM,data:,iv:Tn4ZyqsMEfOI0f/cDBJrR590E0YLqQdV+mLkEGINAuw=,tag:8Cd7TmHCL8Mnk0nBlol/OA==,type:str]
        SESSION_SECRET_KEY: ENC[AES256_GCM,data:n3WWTVCtJRpMNwXhw/Bmo3Ui6tQp/QzjXCyDSjNeprGcTq3BfIDtUt+mDq7cg4YvXgjIOxUK22uJOgxucZkTsw==,iv:kOoGkmgFmCTWOw1ue92a2MTzwn9Tsw47HCjheW4iKfw=,tag:AWyOkc7fd00JeHxhY8ne7A==,type:str]
volumeMounts:
    - name: data
      mountPath: /var/lib/influxdb3
volumeClaimTemplates:
    - name: data
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 5Gi
# config.json (server URL + admin token) is mounted read-only at /app-root/config
volumes:
    - name: ui-config
      secret:
        secretName: influxdb
extraContainers:
    - name: influxdb-ui
      image: docker.io/influxdata/influxdb3-ui:1.9.0
      imagePullPolicy: IfNotPresent
      # --mode=admin enables database/token management (Create Database, etc.) in the UI
      args:
        - --mode=admin
      ports:
        - containerPort: 8080
          name: influxdb-ui
          protocol: TCP
      # pinned so sessions survive pod restarts instead of a fresh random key invalidating them
      env:
        - name: SESSION_SECRET_KEY
          valueFrom:
            secretKeyRef:
                name: influxdb
                key: SESSION_SECRET_KEY
      # influxdb3-ui runs as non-root user influxui (uid 1500); the pod's fsGroup grants it
      # group write access to the data PVC without conflicting with the influxdb container
      securityContext:
        runAsUser: 1500
        runAsNonRoot: true
      volumeMounts:
        - name: ui-config
          mountPath: /app-root/config
          readOnly: true
        # shares the influxdb data PVC, isolated under its own subPath directory
        - name: data
          mountPath: /db
          subPath: influxdb-ui
      livenessProbe:
        tcpSocket:
            port: 8080
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 5
      readinessProbe:
        tcpSocket:
            port: 8080
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 5
      startupProbe:
        tcpSocket:
            port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 18
        timeoutSeconds: 5
      resources:
        requests:
            memory: 256Mi
            cpu: 200m
        limits:
            memory: 1Gi
            cpu: 1
livenessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
readinessProbe:
    tcpSocket:
        port: 8181
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
startupProbe:
    tcpSocket:
        port: 8181
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
resources:
    requests:
        memory: 128Mi
        cpu: 0.2
    limits:
        memory: 1Gi
        cpu: 1
podSecurityContext:
    fsGroup: 1000
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
backup:
    enabled: false
