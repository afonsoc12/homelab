# --------------------
# PostgreSQL
#   - Repo:           https://github.com/postgres/postgres
#   - Docs:           https://www.postgresql.org/docs/
#   - Chart Defaults: https://github.com/afonsoc12/homelab/blob/master/kubernetes/charts/database-svc/values.yaml
# --------------------
labels: {}
# label_1: abc
# label_2: def
podAnnotations: {}
# annot_1: abc
# annot_2: def
replicas: 1
revisionHistoryLimit: 0
strategy:
    type: Recreate
image:
    repository: docker.io/postgres
    tag: 18
#   pullPolicy: Always
command: {}
args: {}
ports:
    - containerPort: 5432
      name: postgres
      protocol: TCP
      service: true
# Uses ports from .ports section, if service is true
service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: ENC[AES256_GCM,data:4oFnJHjub9FZb3E=,iv:xskpYfstI8HjtekM+tkNBgK3i23nMgfnUGtJlekFlk0=,tag:1A2L4UdifUbLrL+77a4DxQ==,type:str]
    annotations:
        metallb.universe.tf/allow-shared-ip: db-svc
secret:
    stringData:
        PGPASSWORD: ENC[AES256_GCM,data:idrcbRkmeqzNCrlS6jGW0TNLjJ4=,iv:2P/JncawA+A8TfuXYBI28hLACjlvejjJnP2monIBgu4=,tag:FbYD1jBRb75E3pxm6jHjwA==,type:str]
        POSTGRES_PASSWORD: ENC[AES256_GCM,data:ba29bZu3fKzn35GX8Yj9BS4f5Ss=,iv:GG57bPhA/KE5nG/VX5eEtfI5rfqOgTFVTI6Qfe7tpqg=,tag:Ie/a/xjSPyK5VyM78bz19Q==,type:str]
volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql
volumeClaimTemplates:
    - name: data
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-persistent
      storage: 5Gi
livenessProbe:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
    exec:
        command:
            - /bin/bash
            - -ec
            - pg_isready -U postgres
readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
    exec:
        command:
            - /bin/bash
            - -ec
            - pg_isready -U postgres
startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
    exec:
        command:
            - /bin/bash
            - -ec
            - pg_isready -U postgres
resources:
    limits:
        cpu: 1
        memory: 512Mi
    requests:
        cpu: 50m
        memory: 128Mi
podSecurityContext: {}
# fsGroup: 2000
securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000
nodeSelector: {}
tolerations: []
affinity: {}
backup:
    enabled: true
    schedule: 0 3 * * *
    rootPasswordKey: POSTGRES_PASSWORD
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    prometheusRule:
        enabled: true
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    # community edition: retention.within only supports minutes (129600m = 90d)
    configmap:
        data:
            db-backup.yml: ENC[AES256_GCM,data:,iv:800fvl8VZmGjKvrQKmpV0L/jZPMpvG/BPMrPgNVgopA=,tag:2Om1JGuYB2eAy6sZuQV21g==,type:str]
    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 100m
            memory: 256Mi
