# Optional per-service metadata for the DockerMan XML template that has no
# equivalent in the compose spec (icon, WebUI link, category, per-field
# descriptions, which env vars to mask as secrets in the GUI). Keyed by
# compose service name.
#
# Migrated from the pre-existing DockerMan template (my-portainer.xml).
portainer:
  icon: https://raw.githubusercontent.com/EMP83/unraid-templates/main/PortainerCE/Portainer.png
  webui: "http://[IP]:[PORT:9000]/"
  category: "Network:Management Productivity: Tools:Utilities"
  overview: |
    Portainer is a lightweight management UI which allows you to easily manage your different Docker environments (Docker hosts or Swarm clusters). Portainer is meant to
    be as simple to deploy as it is to use. It consists of a single container that can run on any Docker engine (can be deployed as Linux container or a Windows native
    container, supports other platforms too). Portainer allows you to manage all your Docker resources (containers, images, volumes, networks and more) ! It is compatible
    with the standalone Docker engine and with Docker Swarm mode.
  registry: "https://hub.docker.com/r/portainer/portainer-ce/"
  project_url: "https://portainer.io"
  support_url: "https://forums.unraid.net/topic/69491-support-jj9987-portainer/"
  port_descriptions:
    "9000": "This is Portainer WebUI port."
  volume_descriptions:
    "/data": "This is where Portainer will store it's configuration."
    "/var/run/docker.sock": "This is needed for Portainer to connect to Docker."
