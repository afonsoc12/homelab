---
# --------------------
# booklore
#   - Project: https://github.com/adityachandelgit/BookLore
# --------------------
services:
  booklore:
    image: ghcr.io/booklore-app/booklore:v2.3.0
    container_name: booklore
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "6060:6060/tcp"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DATABASE_USERNAME: "${DATABASE_USERNAME}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      CA_TS_FALLBACK_DIR: "/app/data"
    volumes:
      - "/mnt/user/appdata/booklore:/app/data"
      - "/mnt/user/media/ebooks/:/books"
