---
# --------------------
# booklore
#   - Project: https://github.com/adityachandelgit/BookLore
# --------------------
services:
  booklore:
    image: ghcr.io/booklore-app/booklore:latest@sha256:d3d3af34bc2cc44349178535ce19e86049968fba2e7d2acf965f770bf37bad01
    container_name: booklore
    restart: unless-stopped
    ports:
      - "6060:6060/tcp"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DATABASE_USERNAME: "${DATABASE_USERNAME}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      CA_TS_FALLBACK_DIR: "/app/data"
    volumes:
      - "/mnt/user/appdata/booklore:/app/data"
      - "/mnt/user/media/ebooks/:/books"
