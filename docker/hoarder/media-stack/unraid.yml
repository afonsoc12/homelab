# compose service name. Any field left out falls back to a sane default -
# this file can be omitted entirely.
#
# Icon/overview/category pulled from the project's own official Unraid CA
# template (https://github.com/hk21x/decide/blob/main/unraid-ca/templates/decide.xml) -
# neither dashboard-icons nor selfhst/icons carry this app.
decide:
  icon: https://raw.githubusercontent.com/hk21x/decide/main/frontend/public/decide-icon-512.png
  project_url: https://github.com/hk21x/decide
  support_url: https://github.com/hk21x/decide/issues
  license: MIT
  webui: "http://[IP]:[PORT:8080]/"
  ingress_host: decide.local
  category: "MediaApp:Video Tools:Utilities"
  overview: |
    decide — Swipe. Decide. Watch.

    A self-hosted swipe-to-match film picker for your Plex library. Two to
    four people swipe through the same small, filtered deck of films from
    your server; when everyone says "Tonight" to the same one it's a match,
    a Final Round crowns the winner, and ticket stubs remember your movie
    nights.

    Plex is linked in-app via the setup wizard (plex.tv/link) on first boot.

    decide is an independent project that works with Plex Media Server. It
    is not affiliated with or endorsed by Plex, Inc.
  volume_descriptions:
    /data: "SQLite database and artwork cache."
  env_descriptions:
    LOCAL_URL: "Address the join QR shows to people on your LAN (e.g. http://192.0.2.10:8090, a documentation-range example - use your own LAN IP). Also settable in-app."
    REMOTE_URL: "Address the join QR shows to remote friends. Points at the Authelia-fronted ingress hostname."
    PUID: "User ID to run as (99 = nobody on Unraid)."
    PGID: "Group ID to run as (100 = users on Unraid)."
    UMASK: "Umask for files created by the container. Not confirmed used by this image, set for consistency with other stacks."
  env_display:
    PUID: advanced
    PGID: advanced
    UMASK: advanced

#
# Migrated from the pre-existing DockerMan template (my-kometa.xml).
kometa:
  icon: https://raw.githubusercontent.com/Kometa-Team/Kometa/nightly/docs/_static/logomark-color.png
  category: "Tools:Utilities"
  overview: |
    Kometa is an open source Python 3 project that has been designed to ease the creation and maintenance of metadata, collections, and playlists within a Plex Media
    Server. The script is designed to be run continuously and be able to update information based on sources outside your plex environment. Kometa supports Movie/TV/Music
    libraries and Playlists.

    Unraid Setup Guide: https://kometa.wiki/en/latest/kometa/install/unraid/
  registry: "https://hub.docker.com/r/kometateam/kometa"
  project_url: "https://kometa.wiki/en/latest/home/"
  support_url: "https://github.com/Kometa-Team/Kometa/issues/new/choose"
  env_descriptions:
    KOMETA_CONFIG: "Specify the location of the configuration YAML file."
    KOMETA_TIME: "Specify the times of day that Kometa will run with comma-separated list of times in HH:MM format."
    KOMETA_RUN: "Set as 'true' to perform a run immediately, bypassing the time to run flag."
    KOMETA_TEST: "Set as 'true' to perform a debug test run immediately, bypassing the time to run flag. This will only run collections with test: true in the definition."
    KOMETA_DEBUG: "Set as 'true' to run with Debug Logs Reporting to the Command Window."
    KOMETA_TRACE: "Set as 'true' to run with extra Trace Debug Logs."
    KOMETA_LOG_REQUESTS: "Set as 'true' to run with every network request printed to the Logs. This can potentially have personal information in it."
    KOMETA_TIMEOUT: "Change the main Kometa timeout. This timeout is overwritten by those in your config file for those services."
    KOMETA_COLLECTIONS_ONLY: "Set as 'true' to only run collection files, skip metadata, library operations, overlays, and playlists."
    KOMETA_METADATA_ONLY: "Set as 'true' to only run metadata files, skip library operations, overlays, playlists, and collections."
    KOMETA_PLAYLISTS_ONLY: "Set as 'true' to only run playlist files, skip metadata, library operations, overlays, and collections."
    KOMETA_OPERATIONS_ONLY: "Set as 'true' to only run library operations skipping metadata, collections, playlists, and overlays."
    KOMETA_OVERLAYS_ONLY: "Set as 'true' to only run library overlays skipping metadata, collections, playlists, and library operations."
    KOMETA_RUN_COLLECTIONS: "Will immediately run the comma-separated list of Collection Names given, bypassing the time to run flag."
    KOMETA_RUN_LIBRARIES: "Will immediately run the comma-separated list of Library Names given, bypassing the time to run flag."
    KOMETA_RUN_FILES: "Will immediately run the comma-separated list of File Names given, bypassing the time to run flag."
    KOMETA_IGNORE_SCHEDULES: "Set as 'true' to ignore all schedules for the run."
    KOMETA_IGNORE_GHOST: "Set as 'true' to ignore all ghost logging for the run. A ghost log is what’s printed to the console to show progress during steps."
    KOMETA_DELETE_COLLECTIONS: "Set as 'true' to delete all collections in a Library prior to running collections/operations."
    KOMETA_DELETE_LABELS: "Set as 'true' to delete all labels on every item in a Library prior to running collections/operations."
    KOMETA_RESUME: "Name of Collection to immediately resume running from the first instance of the specified collection, bypassing the time to run flag."
    KOMETA_NO_COUNTDOWN: "Set as 'true' to run without displaying a countdown to the next scheduled run."
    KOMETA_NO_MISSING: "Set as 'true' to run without utilizing the missing movie/show functions."
    KOMETA_NO_REPORT: "Set as 'true' to run without saving the report."
    KOMETA_READ_ONLY_CONFIG: "Set as 'true' to run without writing to the configuration file."
    KOMETA_DIVIDER: "Character to use as a divider in the logs."
    KOMETA_WIDTH: "Width of the Log Output. Integer between 90 and 300."
    KOMETA_PLEX_URL: "Plex URL to replace ENV in the config file."
    KOMETA_PLEX_TOKEN: "Plex Token to replace ENV in the config file."
  env_display:
    KOMETA_CONFIG: advanced
    KOMETA_TIME: advanced
    KOMETA_RUN: advanced
    KOMETA_TEST: advanced
    KOMETA_DEBUG: advanced
    KOMETA_TRACE: advanced
    KOMETA_LOG_REQUESTS: advanced
    KOMETA_TIMEOUT: advanced
    KOMETA_COLLECTIONS_ONLY: advanced
    KOMETA_METADATA_ONLY: advanced
    KOMETA_PLAYLISTS_ONLY: advanced
    KOMETA_OPERATIONS_ONLY: advanced
    KOMETA_OVERLAYS_ONLY: advanced
    KOMETA_RUN_COLLECTIONS: advanced
    KOMETA_RUN_LIBRARIES: advanced
    KOMETA_RUN_FILES: advanced
    KOMETA_IGNORE_SCHEDULES: advanced
    KOMETA_IGNORE_GHOST: advanced
    KOMETA_DELETE_COLLECTIONS: advanced
    KOMETA_DELETE_LABELS: advanced
    KOMETA_RESUME: advanced
    KOMETA_NO_COUNTDOWN: advanced
    KOMETA_NO_MISSING: advanced
    KOMETA_NO_REPORT: advanced
    KOMETA_READ_ONLY_CONFIG: advanced
    KOMETA_DIVIDER: advanced
    KOMETA_WIDTH: advanced
    KOMETA_PLEX_URL: advanced
    KOMETA_PLEX_TOKEN: advanced
  secret_env:
    - KOMETA_PLEX_TOKEN

