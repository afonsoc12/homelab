# Optional per-service metadata for the DockerMan XML template that has no
# equivalent in the compose spec (icon, WebUI link, category, per-field
# descriptions, which env vars to mask as secrets in the GUI). Keyed by
# compose service name.
#
# media-stack: privoxyvpn + the *arr apps sharing its network namespace,
# plus seerr/plex/decide/kometa/tautulli/tdarr - everything Plex-adjacent.

#
# Migrated from the pre-existing DockerMan template (my-privoxyvpn.xml).
privoxyvpn:
  icon: https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/privoxy-icon.png
  webui: "http://config.privoxy.org/"
  category: "Productivity: Tools:"
  overview: |
    Privoxy is a free non-caching web proxy with filtering capabilities for enhancing privacy, manipulating cookies and modifying web page data and HTTP headers before
    the page is rendered by the browser. Privoxy is a "privacy enhancing proxy", filtering web pages and removing advertisements. Privoxy can be customized by users, for
    both stand-alone systems and multi-user networks. Privoxy can be chained to other proxies and is frequently used in combination with Squid and can be used to bypass
    Internet censorship.
    microsocks is a SOCKS5 service that you can run on your remote boxes to tunnel connections through them, if for some reason SSH doesn't cut it for you. It's very
    lightweight, and very light on resources too: for every client, a thread with a stack size of 8KB is spawned. the main process basically doesn't consume any resources
    at all. The only limits are the amount of file descriptors and the RAM.
    This Docker includes OpenVPN and WireGuard to ensure a secure and private connection to the Internet, including use of iptables to prevent IP leakage when the tunnel
    is down.
  registry: "https://registry.hub.docker.com/r/binhex/arch-privoxyvpn/"
  project_url: "http://www.privoxy.org/"
  support_url: "https://forums.unraid.net/topic/78028-support-binhex-privoxyvpn/"
  secret_env:
    - VPN_PASS
    - LAN_NETWORK
    - VPN_USER
    - SOCKS_PASS
    - SOCKS_USER

