#
# Migrated from the pre-existing DockerMan template (my-tdarr.xml).
tdarr:
  icon: https://raw.githubusercontent.com/selfhosters/unRAID-CA-templates/master/templates/img/tdarr.png
  webui: "http://[IP]:[PORT:8265]"
  ingress_host: tdarr.local
  category: "Productivity: MediaApp:Video spotlight:"
  overview: |
    (Tdarr_Node included) Tdarr V2 is a distributed transcoding system for automating media library transcode/remux management and making sure your files are exactly how
    you need them to be in terms of codecs/streams/containers and so on. Put your spare hardware to use with Tdarr Nodes for Windows, Linux (including Linux arm) and
    macOS.


    Designed to work alongside applications like Sonarr/Radarr and built with the aim of modularisation, parallelisation and scalability, each library you add has its own
    transcode settings, filters and schedule. Workers can be fired up and closed down as necessary, and are split into 4 types - Transcode CPU/GPU and Health Check
    CPU/GPU. Worker limits can be managed by the scheduler as well as manually.


    For a desktop application with similar functionality please see HBBatchBeast.


    Docs here: https://tdarr.io/docs/


    Plugins here: https://github.com/HaveAGitGat/Tdarr_Plugins
  registry: "https://hub.docker.com/r/haveagitgat/tdarr/"
  project_url: "https://github.com/HaveAGitGat/Tdarr"
  support_url: "https://forums.unraid.net/topic/84070-support-haveagitgat-tdarr-audiovideo-library-analytics-transcode-automation/"
  port_descriptions:
    "8266": "Server Port"
    "8265": "WebUI Port"
    "8264": "Node Port"
  env_descriptions:
    serverIP: "Server IP. Required if using Tdarr Nodes on your local network"
    internalNode: "Enable/disable the Node within the server container by setting true/false"
    nodeIP: "Node IP"
    nodeID: "Node ID Name"
    CA_TS_FALLBACK_DIR: "Fallback container directory for tailscale state information - Added By Community Applications"
  env_display:
    CA_TS_FALLBACK_DIR: advanced
