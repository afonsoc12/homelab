# Optional per-service metadata for the DockerMan XML template that has no
# equivalent in the compose spec (icon, WebUI link, category, per-field
# descriptions, which env vars to mask as secrets in the GUI). Keyed by
# compose service name.
#
# Migrated from the pre-existing DockerMan template (my-calibre.xml).
calibre:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/calibre-logo.png
  webui: "http://[IP]:[PORT:8082]"
  category: "Tools:Utilities MediaApp:Books MediaServer:Books"
  overview: |
    Calibre(https://calibre-ebook.com/) is a powerful and easy to use e-book manager. Users say it’s outstanding and a must-have. It’ll allow you to do nearly everything
    and it takes things a step beyond normal e-book software. It’s also completely free and open source and great for both casual users and computer experts.
  registry: "https://github.com/orgs/linuxserver/packages/container/package/calibre"
  project_url: "https://calibre-ebook.com/"
  support_url: "https://github.com/linuxserver/docker-calibre/issues/new/choose"
  port_descriptions:
    "8080": "Calibre desktop gui."
    "8081": "Calibre webserver gui."
  volume_descriptions:
    "/config": "Where calibre should store its database and library."
  env_descriptions:
    PASSWORD: "Optionally set a password for the gui."
    CLI_ARGS: "Optionally pass cli start arguments to calibre."
  env_display:
    PUID: advanced
    PGID: advanced
    UMASK: advanced
  secret_env:
    - PASSWORD
