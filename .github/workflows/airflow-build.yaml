name: ⏱️ Airflow build

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - airflow/**
      - .github/workflows/airflow-build.yaml
  push:
    branches:
      - master
    paths:
      - airflow/**
      - .github/workflows/airflow-build.yaml
  workflow_dispatch:

concurrency:
  group: airflow-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  airflow:
    permissions:
      contents: read
      packages: write
      security-events: write
    runs-on: ubuntu-latest
    outputs:
      airflow_version: ${{ steps.version.outputs.airflow_version }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Set up uv"
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: airflow
          activate-environment: "true"

      - name: "📦 Install dependencies"
        run: uv sync --directory airflow --group dev --frozen

      - name: "🔎 ruff format"
        run: uv run --directory airflow ruff format --check

      - name: "🔎 ruff check"
        run: uv run --directory airflow ruff check

      - name: "🧪 Run pytest"
        run: uv run --directory airflow pytest

      - name: "🔖 Read Airflow version from Dockerfile"
        if: github.event_name != 'pull_request'
        id: version
        run: |
          version=$(grep -oP '^FROM apache/airflow:slim-\K\d+\.\d+\.\d+' airflow/Dockerfile)
          echo "airflow_version=${version}" >> "$GITHUB_OUTPUT"

      - name: "🏗️ Set up Docker Buildx"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Set up container security scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Validate image before publishing
        id: image-scan
        if: github.event_name != 'pull_request'
        run: |
          docker build --tag homelab-security:publish airflow > "$RUNNER_TEMP/image-build.log" 2>&1
          trivy image --config /dev/null --ignorefile /dev/null \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --exit-code 1 --output "$RUNNER_TEMP/publish.sarif" \
            homelab-security:publish > "$RUNNER_TEMP/image-scan.log" 2>&1

      - name: Upload image security findings
        if: always() && steps.image-scan.outcome != 'skipped' && steps.image-scan.outcome != ''
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: ${{ runner.temp }}/publish.sarif
          category: trivy-publish

      - name: "🔐 Login to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Build and Push Image"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: airflow
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/airflow:${{ steps.version.outputs.airflow_version }}-b${{ github.run_number }}
