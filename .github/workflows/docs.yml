---
name: 📚 Docs

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
  push:
    branches:
      - master
    paths:
      - docs/**
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build Docs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true

      - name: 📦 Install dependencies
        run: uv sync --locked --all-groups

      - name: 🏷️ Extract version from commit SHA
        id: version
        run: |
          VERSION="$(date -u +%Y.%m.%d)+${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: 🔨 Build mkdocs
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: uv run mkdocs build --site-dir site

      - name: 🗜️ Archive site
        run: zip -r homelab-docs-v${{ steps.version.outputs.version }}.zip site/

      - name: ⬆️ Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: ⬆️ Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-archive
          path: homelab-docs-v${{ steps.version.outputs.version }}.zip

  deploy:
    permissions:
      pages: write
      id-token: write
    name: 🌐 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  publish:
    permissions:
      contents: write
    name: 📦 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: ⬇️ Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-archive

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: homelab-docs-v${{ needs.build.outputs.version }}.zip
