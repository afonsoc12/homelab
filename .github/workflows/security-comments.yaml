name: Security PR comments

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Security]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: security-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Update security status comment
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately no checkout or artifact download: PR code never runs with write permissions.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            if (run.path !== '.github/workflows/security.yaml') {
              throw new Error('Unexpected security workflow path');
            }
            const candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...repo, commit_sha: run.head_sha, per_page: 100
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, per_page: 100
            });
            const names = ['Security policy tests', 'Dependency review', 'CodeQL (python)', 'CodeQL (actions)',
              'Dependency and infrastructure scan', 'Container scan', 'Security gate'];
            const rows = names.map(name => {
              const job = jobs.find(item => item.name === name);
              const result = job?.conclusion ?? 'missing';
              const allowed = ['success', 'failure', 'cancelled', 'skipped', 'timed_out', 'action_required'];
              return `| ${name} | ${allowed.includes(result) ? result : 'incomplete'} |`;
            });
            const marker = '<!-- homelab-security-status -->';
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`;
            const securityUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/security/code-scanning`;
            const body = [marker, '### Security review', '',
              `Scanned commit: \`${run.head_sha}\``, '',
              '| Check | Result |', '| --- | --- |', ...rows, '',
              `[Scan run](${runUrl}) · [Detailed security findings](${securityUrl})`, '',
              'Findings are reported through checks and annotations. Fixes require a reviewed PR; '
              + 'this workflow never changes source files or merges PRs.', '',
              'Repository scanning blocks new high/critical findings compared with the PR base. '
              + 'Container scanning blocks fixable high/critical vulnerabilities when the image is rebuilt.'
            ].join('\n');
            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({...repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.base.repo.full_name !== `${repo.owner}/${repo.repo}`
                  || pr.base.ref !== 'master' || pr.head.sha !== run.head_sha) continue;
              const { data: latestRun } = await github.rest.actions.getWorkflowRun({...repo, run_id: run.id});
              if (latestRun.run_attempt !== run.run_attempt) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pr.number, per_page: 100
              });
              const existing = comments.find(comment => comment.user.login === 'github-actions[bot]'
                && comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({...repo, comment_id: existing.id, body});
              } else {
                await github.rest.issues.createComment({...repo, issue_number: pr.number, body});
              }
            }
