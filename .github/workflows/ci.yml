---
name: 🔍 CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gitleaks:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔑 Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true

      - name: 📦 Install dependencies
        run: uv sync --locked --group dev

      - name: 🔐 Check SOPS encryption
        run: uv run python scripts/check_sops.py

      - name: 🔍 Run yamllint
        run: uv run yamllint .

      - name: 📦 Install Ansible Galaxy collections and roles
        run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -r ansible/requirements.yml -p ~/.local/share/ansible/roles

      - name: 🔍 Run ansible-lint
        run: cd ansible && uv run ansible-lint .

  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 🔍 Run Helm lint
        run: |
          result=0
          while IFS= read -r -d '' chart_file; do
            chart="${chart_file%/Chart.yaml}"
            echo "Linting $chart"
            helm lint "$chart" || result=1
          done < <(find kubernetes -name "Chart.yaml" -print0)
          exit "$result"

  terraform-fmt:
    name: 🏗️ Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 🔍 Run Terraform format
        run: terraform fmt -check -recursive terraform/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    env:
      TRIVY_INCLUDE_DEV_DEPS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'on-failure' || 'never' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Scan dependencies and infrastructure
        if: ${{ !cancelled() }}
        id: repository-scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          skip-dirs: .git,.venv,.cache,ansible/roles
          skip-files: '**/.decrypted~*'
      - name: Upload security findings
        if: always() && steps.repository-scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-repository
      - name: Build without publishing
        if: ${{ !cancelled() }}
        run: docker build --tag homelab-security:scan airflow
      - name: Scan built image
        if: ${{ !cancelled() }}
        id: scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: homelab-security:scan
          scanners: vuln
          format: sarif
          output: container.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload container findings
        if: always() && steps.scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: container.sarif
          category: trivy-container
