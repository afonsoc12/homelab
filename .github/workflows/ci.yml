---
name: 🔍 CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gitleaks:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🔑 Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          activate-environment: true

      - name: 📦 Install dependencies
        run: uv sync --locked --group dev

      - name: 🔐 Check SOPS encryption and pinned deployment tools
        run: |
          uv run python scripts/check_sops.py
          uv run python scripts/check_argocd_tools.py

      - name: 🔍 Run yamllint
        run: uv run yamllint .

      - name: 📦 Install Ansible Galaxy collections and roles
        run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -r ansible/requirements.yml -p ~/.local/share/ansible/roles

      - name: 🔍 Run ansible-lint
        run: cd ansible && uv run ansible-lint .

  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 🔍 Run Helm lint
        run: |
          result=0
          while IFS= read -r -d '' chart_file; do
            chart="${chart_file%/Chart.yaml}"
            echo "Linting $chart"
            helm lint "$chart" || result=1
          done < <(find kubernetes -name "Chart.yaml" -print0)
          exit "$result"

  terraform-fmt:
    name: 🏗️ Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 🔍 Run Terraform format
        run: terraform fmt -check -recursive terraform/
