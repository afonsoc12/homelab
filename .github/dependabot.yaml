version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /airflow
    schedule:
      interval: weekly
    # Renovate owns routine updates. Dependabot proposes security fixes only.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - '*'
